# Network shares for scripts/50-fstab.sh
# =============================================================================
#  One share per line:
#      //server/share    /mount/point
#
#  Blank lines and #-comments are ignored. When this file is absent or empty,
#  50-fstab.sh prompts for shares interactively instead.
#
#  CREDENTIALS ARE NOT STORED HERE, and this file is safe to commit. The script
#  asks once per server and writes /etc/samba/credentials.d/<server> with mode
#  0600 root:root, then references it from fstab with `credentials=`. Never put
#  a password in an fstab line: /etc/fstab is world-readable (0644), so every
#  local user could read it.
#
#  The mount options the script generates:
#      credentials=...        password kept out of fstab
#      uid=/gid=              your user owns the files (CIFS has no Unix perms
#                             mapping by default)
#      file_mode/dir_mode     sane permissions on the mounted tree
#      nofail                 a missing server never blocks boot
#      _netdev                mount only after the network is up
#      x-systemd.automount    mount on first access, not at boot: no boot delay
#                             and no hang when the server is unreachable
#      x-systemd.idle-timeout=60
#                             unmount after a minute idle, so a server that
#                             goes away does not wedge the mount
#
#  Uncomment and edit for your own server, or leave it all commented and enter
#  shares interactively.
# =============================================================================

# //192.168.1.10/Movies      /mnt/Movies
# //192.168.1.10/Series      /mnt/Series
# //192.168.1.10/Music       /mnt/Music
# //192.168.1.10/Misc        /mnt/Misc
# //192.168.1.10/Personal    /mnt/Personal
# //192.168.1.10/Backup      /mnt/Backup
