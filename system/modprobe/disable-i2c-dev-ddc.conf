# Prevent the i2c-dev module from loading, which disables DDC/CI entirely.
#
# WHY THIS EXISTS
# DDC/CI is the protocol userspace uses to read/set an external monitor's
# brightness and contrast over the display cable. On DisplayPort it rides the
# AUX channel, the same channel used for link training and hotplug detect.
#
# On this hardware one external monitor (a DisplayPort connector behind a
# passive USB-C -> HDMI adaptor) never answers DDC. Every probe against it
# burns ~2.5s of AUX traffic and fails, and doing that while the link is
# renegotiating (at login, or on resume) makes the monitor come up slowly or
# not at all. Measured: 2627ms per failed probe versus 11ms when the bus is
# inaccessible.
#
# WHY BLOCK THE WHOLE MODULE RATHER THAN ONE BUS
# Nothing here needs software brightness control on external monitors; their
# physical buttons do the job. Blocking the module is the universal fix: it
# needs no per-machine bus detection, cannot be defeated by /dev/i2c-N
# renumbering across reboots, and stops EVERY DDC consumer at once
# (DankMaterialShell, ddcutil, fastfetch's brightness module, KDE powerdevil).
#
# WHY `install ... /bin/false` AND NOT `blacklist`
# VERIFIED EMPIRICALLY, this is a real trap: `blacklist` only suppresses
# AUTOMATIC loading (module dependencies and udev). Both ddcutil and i2c-tools
# ship /usr/lib/modules-load.d/*.conf naming i2c-dev, and systemd-modules-load
# runs modprobe EXPLICITLY for those, which ignores a blacklist entry:
#
#   with `blacklist i2c_dev`          -> modprobe rc=0, module LOADS  (bypassed)
#   with `install i2c_dev /bin/false` -> modprobe rc=1, module blocked (works)
#
# The companion file system/modules-load/ddcutil.conf masks ddcutil's own
# modules-load entry so systemd stops trying at every boot and logging a
# failure. Both are installed together by 30-system-tweaks.sh.
#
# WHAT THIS DOES NOT BREAK
#  - Monitor DETECTION. EDID arrives over the DP AUX link during link training,
#    in-kernel, with no DDC involvement. Verified: all outputs still report
#    status=connected with i2c-dev unloaded.
#  - The LAPTOP panel's brightness. That uses the kernel backlight interface
#    (/sys/class/backlight/nvidia_0, type=raw), not i2c. Brightness keys keep
#    working.
#  - The i2c adapters themselves. The GPU driver still creates them under
#    /sys/bus/i2c/devices/; only the /dev/i2c-* character devices disappear.
#
# WHAT IT DOES COST
#  - Software brightness/contrast on EXTERNAL monitors, everywhere. Use the
#    monitors' physical buttons.
#  - `ddcutil` and `i2c-tools` stop working ("No /dev/i2c devices exist"), as
#    does anything else speaking raw i2c from userspace, including some
#    RGB/fan-control and EEPROM tools.
#
# Reverse with: 30-system-tweaks.sh --revert  (then reboot, or modprobe i2c_dev)
install i2c_dev /bin/false
