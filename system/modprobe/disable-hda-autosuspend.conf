# Keep the Intel HDA audio codec powered so it does not click/pop on wake or
# drop the first fraction of a second of playback after going idle.
#
# power_save=0            never autosuspend the codec
# power_save_controller=N never autosuspend the controller either
#
# Cost: a small amount of idle power draw. On a laptop that is usually a
# worthwhile trade for not losing the start of every notification sound.
options snd_hda_intel power_save=0
options snd_hda_intel power_save_controller=N
