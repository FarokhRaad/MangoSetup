# Smooth out write-then-stall bursts when copying to network shares (CIFS/SMB).
#
# Default vm.dirty_ratio / vm.dirty_background_ratio are expressed as a
# PERCENTAGE OF TOTAL RAM, so on a 32GB machine the kernel can buffer several
# GB of dirty pages in page cache before forcing a hard synchronous writeback
# stall. Copying to a slow backend (gigabit CIFS share -> mechanical HDD) then
# looks like: huge burst at RAM speed, long dead pause while the backlog
# drains, repeat. Average throughput ends up well under the real ceiling even
# though the link and disk are both healthy.
#
# Capping dirty pages to a small ABSOLUTE BYTE value forces writeback to start
# almost immediately and stay continuous, so throughput in file managers
# (Dolphin, Nautilus, plain cp) matches the real disk/network ceiling instead
# of oscillating between RAM speed and zero.
#
# Setting the *_bytes variants automatically zeroes the *_ratio variants;
# that is expected, not a misconfiguration.
#
# Safe on machines with no network shares: 48MB is far below any NVMe/SSD
# write speed, so this never becomes the limiting factor for fast local disks.
# It only changes behaviour for genuinely slow write targets (network shares,
# spinning disks, USB drives). There is no per-filesystem equivalent; the
# global sysctl is the correct level to apply this at.

vm.dirty_background_bytes = 16777216
vm.dirty_bytes = 50331648
