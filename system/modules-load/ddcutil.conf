# Intentionally empty: masks /usr/lib/modules-load.d/ddcutil.conf
#
# ddcutil ships a modules-load.d file containing "i2c-dev", which makes
# systemd-modules-load run modprobe for it explicitly at every boot. Paired
# with /etc/modprobe.d/disable-i2c-dev-ddc.conf (install i2c_dev /bin/false)
# that attempt always FAILS, and systemd-modules-load.service logs an error and
# enters a failed state on every boot even though the outcome is what we want.
#
# A file of the same name in /etc/modules-load.d takes precedence over the one
# in /usr/lib, so this empty file stops the attempt being made at all: no
# failed unit, no noise in the journal.
#
# Installed alongside i2c-tools' equivalent (i2c-tools.conf) by
# scripts/30-system-tweaks.sh, and removed again by its --revert.
