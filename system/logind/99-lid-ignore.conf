#  Ignore the laptop lid switch: never suspend or act on lid open/close.
#
#  WHY A DROP-IN AND NOT AN EDIT TO logind.conf
#  /etc/systemd/logind.conf is OWNED BY THE systemd PACKAGE (verified with
#  `pacman -Qo`). Editing it in place means every systemd upgrade that changes
#  the shipped file leaves a .pacnew you have to merge by hand, forever, and a
#  careless merge silently reverts these settings. systemd's own header says
#  the drop-in directory is "generally recommended". A drop-in is also trivially
#  reversible: delete one file, no diffing required.
#
#  WHAT EACH KEY DOES
#    HandleLidSwitch               closing the lid on battery
#    HandleLidSwitchExternalPower  closing the lid while on AC
#    HandleLidSwitchDocked         closing the lid with an external display or
#                                  docking station attached
#  All three are set, because setting only the first still suspends the machine
#  on AC (upstream default for ExternalPower is "suspend").
#
#  HoldoffTimeoutSec is how long logind ignores lid/power events after a resume
#  or after startup. The upstream default of 30s is long enough that a quick
#  close-open cycle gets swallowed; 5s keeps the debounce without the lag.
#
#  CONSEQUENCE: closing the lid leaves the machine RUNNING with the internal
#  panel still powered. That is the point when driving external monitors with
#  the lid shut, but on battery in a bag it will stay awake and get hot. Revert
#  with the system-tweaks picker (--revert) if you stop wanting that.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HoldoffTimeoutSec=5s
