"$schema" = 'https://starship.rs/config-schema.json'
palette = "kanagawa"

format = """
[](color_bg1)\
$os\
[](fg:color_bg1 bg:color_bg1)\
$directory\
[](fg:color_bg1 bg:color_var2)\
$git_branch\
$git_status\
[](fg:color_var2 bg:color_var1)\
$golang\
$nodejs\
$python\
[](fg:color_var1)\
$docker_context\

$character"""


[palettes.gruvbox]
color_fg    = '#fbf1c7'
color_bg1   = '#3c3836'
color_bg3   = '#665c54'
color_var1  = '#458588'
color_var2  = '#3e5b77'
color_var3  = '#98971a'
color_var4  = '#d65d0e'
color_var5  = '#b16286'
color_var6  = '#cc241d'
color_var7  = '#d79921'

[palettes.dracula]
color_fg    = '#f8f8f2'   # Foreground
color_bg1   = '#44475a'   # Current Line / Selection
color_bg3   = '#6272a4'   # Comment
color_var1  = '#ff79c6'   # Pink
color_var2  = '#6272a4'   # Comment
color_var3  = '#50fa7b'   # Green
color_var4  = '#ffb86c'   # Orange
color_var5  = '#bd93f9'   # Purple
color_var6  = '#ff5555'   # Red
color_var7  = '#f1fa8c'   # Yellow

[palettes.kanagawa]
color_fg    = '#DCD7BA'   # fujiWhite / foreground
color_bg1   = '#363646'   # sumiInk3 (OS + directory)
color_bg3   = '#54546D'   # sumiInk5 (docker / conda / username)
color_var1  = '#957FB8'   # oniViolet (languages)
color_var2  = '#2D4F67'   # waveBlue2 / selection (git)
color_var3  = '#98BB6C'   # springGreen (success)
color_var4  = '#FFA066'   # surimiOrange
color_var5  = '#938AA9'   # springViolet (vim replace)
color_var6  = '#C34043'   # red (error)
color_var7  = '#E6C384'   # carpYellow

[os]
disabled = false
style = "bg:color_bg1 fg:color_fg"

[os.symbols]
#  Only the systems actually in use are listed. Starship falls back to its own
#  built-in symbol for anything not named here, so trimming this list loses
#  nothing.
#  The TRAILING SPACE inside each string is deliberate: these are Nerd Font
#  glyphs, and without the space the glyph renders clipped against the text
#  that follows it. Do not "tidy" it away.
Windows = "󰍲 "
Arch = "󰣇 "
Ubuntu = "󰕈 "

[username]
show_always = false
style_user = "bg:color_bg3 fg:color_fg"
style_root = "bg:color_bg3 fg:color_fg"
format = '[ $user ]($style)'

[directory]
style = "fg:color_fg bg:color_bg1"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color_var2"
format = '[[ $symbol $branch ](fg:color_fg bg:color_var2)]($style)'

[git_status]
style = "bg:color_var2"
format = '[[($all_status$ahead_behind )](fg:color_fg bg:color_var2)]($style)'

[nodejs]
symbol = ""
style = "bg:color_var1"
format = '[[ $symbol( $version) ](fg:color_fg bg:color_var1)]($style)'

[c]
symbol = " "
style = "bg:color_var1"
format = '[[ $symbol( $version) ](fg:color_fg bg:color_var1)]($style)'

[cpp]
symbol = " "
style = "bg:color_var1"
format = '[[ $symbol( $version) ](fg:color_fg bg:color_var1)]($style)'

[rust]
symbol = ""
style = "bg:color_var1"
format = '[[ $symbol( $version) ](fg:color_fg bg:color_var1)]($style)'

[golang]
symbol = ""
style = "bg:color_var1"
format = '[[ $symbol( $version) ](fg:color_fg bg:color_var1)]($style)'

[php]
symbol = ""
style = "bg:color_var1"
format = '[[ $symbol( $version) ](fg:color_fg bg:color_var1)]($style)'

[java]
symbol = ""
style = "bg:color_var1"
format = '[[ $symbol( $version) ](fg:color_fg bg:color_var1)]($style)'

[kotlin]
symbol = ""
style = "bg:color_var1"
format = '[[ $symbol( $version) ](fg:color_fg bg:color_var1)]($style)'

[haskell]
symbol = ""
style = "bg:color_var1"
format = '[[ $symbol( $version) ](fg:color_fg bg:color_var1)]($style)'

[python]
symbol = ""
style = "bg:color_var1"
format = '[[ $symbol( $version) ](fg:color_fg bg:color_var1)]($style)'

[docker_context]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol( $context) ](fg:#7AA89F bg:color_bg3)]($style)'

[conda]
style = "bg:color_bg3"
format = '[[ $symbol( $environment) ](fg:#7AA89F bg:color_bg3)]($style)'

[pixi]
style = "bg:color_bg3"
format = '[[ $symbol( $version)( $environment) ](fg:color_fg bg:color_bg3)]($style)'

[time]
disabled = true
time_format = "%R"
style = "bg:color_bg1"
format = '[[  $time ](fg:color_fg bg:color_bg1)]($style)'

[line_break]
disabled = false

[character]
disabled = true
success_symbol = '[](bold fg:color_var3)'
error_symbol = '[](bold fg:color_var6)'
vimcmd_symbol = '[](bold fg:color_var3)'
vimcmd_replace_one_symbol = '[](bold fg:color_var5)'
vimcmd_replace_symbol = '[](bold fg:color_var5)'
vimcmd_visual_symbol = '[](bold fg:color_yellow)'

# >>> STARSHIP PALETTE >>>
#  Static palette, safe to hand-edit.
#
#  These values were originally emitted by a shell theming template that is no
#  longer in use (DankMaterialShell drives theming through matugen, and matugen
#  has no starship template configured here). Nothing regenerates this block,
#  so it is now plain static config: edit the hex values freely.
#
#  To make the prompt follow the wallpaper again, add a starship template to
#  ~/.config/matugen/config.toml and let matugen own this file instead.

[palettes.mangosetup]
# Standard colors
blue      = "#bd93f9"
red       = "#ff5555"
green     = "#50fa7b"
yellow    = "#f1fa8c"
cyan      = "#8be9fd"
magenta   = "#ff79c6"
white     = "#f8f8f2"
black     = "#21222c"

# Extended palette (Catppuccin-compatible names)
rosewater = "#ffffa5"
flamingo  = "#ff6e6e"
pink      = "#ff92df"
mauve     = "#ff79c6"
maroon    = "#ff6e6e"
peach     = "#ffffa5"
teal      = "#8be9fd"
sky       = "#a4ffff"
sapphire  = "#d6acff"
lavender  = "#ff92df"

# Text shades
text      = "#f8f8f2"
subtext1  = "#f8f8f2"
subtext0  = "#6272a4"

# Surface shades
overlay2  = "#6272a4"
overlay1  = "#6272a4"
overlay0  = "#21222c"
surface2  = "#21222c"
surface1  = "#21222c"
surface0  = "#282a36"
base      = "#282a36"
mantle    = "#282a36"
crust     = "#282a36"
# <<< STARSHIP PALETTE <<<
