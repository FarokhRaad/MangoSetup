<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Prefer Noto Color Emoji for emoji codepoints.

  WHY THIS FILE EXISTS
  ~/.fonts/Segoe UI/ contains seguisym.ttf ("Segoe UI Symbol"), which
  advertises coverage of emoji codepoints but has NO color tables
  (checked its sfnt table directory: no CBDT/CBLC/sbix/COLR/CPAL/SVG).
  It is a monochrome symbol font.

  Because it sorts ahead of Noto Color Emoji in fontconfig's match order,
  `fc-match -s ":charset=1F389"` returned:
      1. Segoe UI Symbol    <- monochrome, was winning
      2. Segoe UI Emoji     <- color (COLR/CPAL) but Windows-specific
      3. Noto Color Emoji   <- color (CBDT/CBLC), the one we want

  Result: emoji rendered as flat grey outlines instead of color glyphs.
  Arch ships no emoji-preference file by default (there is no
  75-noto-color-emoji.conf in /etc/fonts/conf.d), so nothing corrected this.

  WHAT THIS DOES
  1. Binds the generic "emoji" family to Noto Color Emoji.
  2. Appends Noto Color Emoji as the emoji fallback after the three main
     generic families, so any app asking for sans/serif/mono gets color
     emoji for codepoints its primary font lacks.
  3. Demotes the two Segoe emoji/symbol fonts for emoji coverage only, by
     rewriting a request for them into Noto Color Emoji. Segoe UI proper
     (the text family) is untouched and still available for UI text.

  VERIFY
    fc-match emoji                     -> NotoColorEmoji.ttf
    fc-match -s ":charset=1F389" family | head -3   -> Noto Color Emoji first
-->
<fontconfig>

  <!-- 1. The generic "emoji" family resolves to Noto Color Emoji. -->
  <alias binding="strong">
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!--
    2. Color emoji as the emoji fallback for the generic families.

    PITFALL (hit and fixed while writing this file): using
        <alias binding="strong"><family>monospace</family>
          <default><family>Noto Color Emoji</family></default></alias>
    BREAKS the generic family. `<default>` in an alias means "use this when
    nothing else matched", and with binding="strong" it won the whole match,
    so `fc-match monospace` and `fc-match serif` both started returning
    NotoColorEmoji.ttf instead of Noto Sans Mono / a real serif. Verified by
    fc-match immediately after fc-cache.

    The correct construct is a target="pattern" match that APPENDS the emoji
    font to the family list, so it is only consulted for codepoints the
    primary font does not cover.
  -->
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true">
      <string>serif</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true">
      <string>monospace</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!--
    3. Strip emoji coverage from the monochrome Segoe symbol font.

    WHY target="scan" AND NOT a pattern edit:
    An earlier attempt used
        <match target="pattern"><test name="family">Segoe UI Symbol</test>
          <edit name="family" mode="prepend">Noto Color Emoji</edit></match>
    That only rewrites requests that NAME Segoe UI Symbol explicitly. It does
    nothing for the fallback path, which is what actually matters: when an app
    asks for sans-serif/monospace and hits an emoji codepoint its primary font
    lacks, fontconfig walks a COVERAGE-SORTED list, and Segoe UI Symbol still
    sorted first. Confirmed with
        fc-match -s "sans-serif:charset=1F389" family | head -1
    which still returned "Segoe UI Symbol" after that edit.

    target="scan" rewrites the font's advertised charset as the font is
    indexed into the cache, so it stops claiming emoji coverage at all and
    drops out of the emoji fallback entirely. Its non-emoji symbol glyphs
    (arrows, math, dingbats, box drawing) are untouched and still usable.

    Requires `fc-cache -f` after any edit, since it acts at scan time.

    Ranges removed (emoji proper, not general symbols):
      1F000-1F02F  Mahjong        1F0A0-1F0FF  Playing cards
      1F300-1F5FF  Misc Symbols and Pictographs
      1F600-1F64F  Emoticons      1F680-1F6FF  Transport and Map
      1F900-1F9FF  Supplemental Symbols and Pictographs
      1FA70-1FAFF  Symbols and Pictographs Extended-A
      1F1E6-1F1FF  Regional indicators (flags)
  -->
  <match target="scan">
    <test name="family" compare="eq" ignore-blanks="true">
      <string>Segoe UI Symbol</string>
    </test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range><int>0x2600</int><int>0x27BF</int></range>
          <range><int>0x2B00</int><int>0x2BFF</int></range>
          <range><int>0x1F000</int><int>0x1F02F</int></range>
          <range><int>0x1F0A0</int><int>0x1F0FF</int></range>
          <range><int>0x1F1E6</int><int>0x1F1FF</int></range>
          <range><int>0x1F300</int><int>0x1F5FF</int></range>
          <range><int>0x1F600</int><int>0x1F64F</int></range>
          <range><int>0x1F680</int><int>0x1F6FF</int></range>
          <range><int>0x1F900</int><int>0x1F9FF</int></range>
          <range><int>0x1FA70</int><int>0x1FAFF</int></range>
        </charset>
      </minus>
    </edit>
  </match>

  <!--
    Segoe UI Emoji IS a real color font (COLR/CPAL v0), so emoji did render
    in color once seguisym was stripped. It is nonetheless demoted below Noto
    Color Emoji, because CBDT/CBLC (Noto) has broader and more consistent
    support across the toolkits in use here (GTK3/GTK4, Qt5/Qt6, Chromium/
    Electron, kitty) than COLR/CPAL does, and mixing two emoji sets across
    apps looks inconsistent.

    Same target="scan" charset-subtraction technique as above. Segoe UI Emoji
    stays installed and still resolves when named explicitly.
  -->
  <match target="scan">
    <test name="family" compare="eq" ignore-blanks="true">
      <string>Segoe UI Emoji</string>
    </test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range><int>0x2600</int><int>0x27BF</int></range>
          <range><int>0x2B00</int><int>0x2BFF</int></range>
          <range><int>0x1F000</int><int>0x1F02F</int></range>
          <range><int>0x1F0A0</int><int>0x1F0FF</int></range>
          <range><int>0x1F1E6</int><int>0x1F1FF</int></range>
          <range><int>0x1F300</int><int>0x1F5FF</int></range>
          <range><int>0x1F600</int><int>0x1F64F</int></range>
          <range><int>0x1F680</int><int>0x1F6FF</int></range>
          <range><int>0x1F900</int><int>0x1F9FF</int></range>
          <range><int>0x1FA70</int><int>0x1FAFF</int></range>
        </charset>
      </minus>
    </edit>
  </match>

  <!--
    4. Strip emoji coverage from Font Awesome (otf-font-awesome 7.3.1).

    THIRD culprit, found only by testing multiple codepoints rather than one.
    After fixing the two Segoe fonts, U+1F389 resolved correctly, but
    U+1F600 (grinning face), U+1F44D (thumbs up), U+2764 (heart) and
    U+1F9E0 (brain) all still resolved to "Font Awesome 7 Free", which has
    NO color tables (verified: monochrome). Those emoji would have rendered
    as flat monochrome icon-font glyphs.

    Lesson: checking a single emoji codepoint is not sufficient to validate
    an emoji fontconfig fix. Different fonts claim different subranges.

    Font Awesome is kept installed and fully functional: Noctalia and the
    bar/waybar-style widgets use its Private Use Area glyphs (U+E000-F8FF,
    U+F0000+), which are NOT touched here. Only the real Unicode emoji
    ranges are removed, plus the specific BMP pictographs it squats on
    (U+2600-27BF misc symbols/dingbats, U+2B00-2BFF arrows/symbols,
    U+FE0F variation selector is left alone as it carries no glyph).
  -->
  <match target="scan">
    <test name="family" compare="contains" ignore-blanks="true">
      <string>Font Awesome</string>
    </test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range><int>0x2600</int><int>0x27BF</int></range>
          <range><int>0x2B00</int><int>0x2BFF</int></range>
          <range><int>0x1F000</int><int>0x1F02F</int></range>
          <range><int>0x1F0A0</int><int>0x1F0FF</int></range>
          <range><int>0x1F1E6</int><int>0x1F1FF</int></range>
          <range><int>0x1F300</int><int>0x1F5FF</int></range>
          <range><int>0x1F600</int><int>0x1F64F</int></range>
          <range><int>0x1F680</int><int>0x1F6FF</int></range>
          <range><int>0x1F900</int><int>0x1F9FF</int></range>
          <range><int>0x1FA70</int><int>0x1FAFF</int></range>
        </charset>
      </minus>
    </edit>
  </match>


</fontconfig>
