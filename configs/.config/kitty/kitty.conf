# Font Configuration
font_family      family="FiraCode Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto

# Window Configuration
window_padding_width 12
background_opacity 0.90
background_blur 100
hide_window_decorations yes

# Cursor Configuration
cursor_shape block
cursor_blink_interval 1

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings for common actions
map ctrl+shift+n new_window
map ctrl+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Tab configuration
tab_bar_style powerline
tab_bar_align left

# Shell integration
shell_integration enabled

# Dank color generation
#  These two files are GENERATED by matugen when DankMaterialShell applies a
#  theme, so they are deliberately not shipped in this repo (they would be
#  overwritten on first theme change anyway).
#
#  `globinclude` is used rather than `include` on purpose: a plain `include` of
#  a file that does not exist is an error kitty reports on every start, which is
#  exactly what happens on a fresh install BEFORE the first theme is applied.
#  A glob that matches nothing is silently skipped.
globinclude dank-tabs.conf
globinclude dank-theme.conf

# Confirmation prompts
confirm_os_window_close 0

