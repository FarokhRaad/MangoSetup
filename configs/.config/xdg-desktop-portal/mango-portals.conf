# XDG desktop portal backend selection for mango
#
# WHY THIS FILE IS NEEDED
# xdg-desktop-portal picks a backend per interface by matching each installed
# .portal file's `UseIn=` line against $XDG_CURRENT_DESKTOP. Verified on a live
# system, the installed backends declare:
#
#   kde.portal    UseIn=KDE     provides ScreenCast, Screenshot, FileChooser, ...
#   gtk.portal    UseIn=gnome   provides FileChooser, Print, Settings, ... (NO ScreenCast)
#   wlr.portal    (wlroots)     provides ScreenCast, Screenshot
#
# mango sets XDG_CURRENT_DESKTOP=mango itself (src/mango.c: setenv("XDG_CURRENT_DESKTOP",
# "mango", 1)), so NONE of those UseIn values match. Without this file the
# choice of backend is left undefined: screen sharing silently gets no backend,
# or a portal is picked non-deterministically between runs. That produces the
# classic "OBS/Discord/Zoom screen share shows a black screen" bug, which is
# miserable to diagnose after the fact.
#
# FILENAME MATTERS: mango reads `mango-portals.conf`, not the generic
# `portals.conf`. Per the mango docs the search order is
#   1. ~/.config/xdg-desktop-portal/mango-portals.conf   (this file, user, wins)
#   2. /usr/share/xdg-desktop-portal/mango-portals.conf  (system fallback)
#
# The values below are the ones mango's own documentation recommends.

[preferred]
# Everything not named explicitly goes to the GTK backend: it owns the file
# picker, print dialog, app chooser and settings, and works outside GNOME
# despite its UseIn=gnome declaration.
default=gtk

# Screen capture must go to the wlroots backend. GTK's portal does not
# implement these interfaces at all, and KDE's requires a Plasma session.
# Needs xdg-desktop-portal-wlr plus pipewire and pipewire-pulse.
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr

# Secrets go to gnome-keyring, which autostart.conf already launches with
# --components=secrets,ssh. This is what lets VS Code, browsers and mail
# clients store credentials without a Plasma/KWallet session.
org.freedesktop.impl.portal.Secret=gnome-keyring

# Idle inhibition is deliberately DISABLED here. DankMaterialShell owns idle
# and locking through its own IPC (`dms ipc call inhibit ...`), so routing
# Inhibit to a portal backend as well gives two systems fighting over the same
# state: the usual symptom is a screen that locks during video playback, or one
# that never locks at all.
org.freedesktop.impl.portal.Inhibit=none
