# =============================================================================
#  GTK 3 settings
# =============================================================================
#  MIGRATION NOTE: on this machine, ~/.config/gtk-3.0/settings.ini was found
#  to be a BROKEN symlink pointing to itself (leftover from an earlier
#  DankMaterialShell/matugen wiring attempt: `ln -sf settings.ini settings.ini`
#  inside the same directory). Any GTK app reading it got ELOOP and fell back
#  to hardcoded defaults, silently. This file replaces that with the last
#  known-good settings, recovered from settings.ini.bak-20260619-195043.
#
#  If you opt into Noctalia's builtin "gtk3"/"gtk4" theme templates (see
#  configs/.config/noctalia/config.toml's [theme.templates] section), those
#  write a SEPARATE file, gtk-3.0/noctalia.css, and gtk.css @imports it. They
#  do not touch settings.ini, so this file and that template coexist safely.
# =============================================================================
[Settings]
gtk-application-prefer-dark-theme=true
gtk-button-images=true
gtk-cursor-blink=true
gtk-cursor-blink-time=1000
gtk-cursor-theme-name=breeze_cursors
gtk-cursor-theme-size=24
gtk-decoration-layout=icon:minimize,maximize,close
gtk-enable-animations=true
gtk-font-name=Vazirmatn, 10
gtk-icon-theme-name=Breeze Chameleon Dark
gtk-menu-images=true
#  NOTE: the recovered original had
#    gtk-modules=colorreload-gtk-module:window-decorations-gtk-module
#  Both modules are shipped by kde-gtk-config, which is removed alongside
#  Plasma (see ../one-time-migration/70-remove-plasma.sh). Left unset here
#  so GTK apps don't warn about a missing module after that removal; add it
#  back if you keep kde-gtk-config installed.
gtk-primary-button-warps-slider=true
gtk-sound-theme-name=ocean
gtk-theme-name=Breeze
gtk-toolbar-style=3
gtk-xft-dpi=122880
