# =============================================================================
#  mango - main configuration entry point
# =============================================================================
#  Target version : mango 0.15.5 (github.com/mangowm/mango)
#  Docs           : https://mangowm.github.io/docs/
#  Shell          : DankMaterialShell (Quickshell + Go)
#                   docs: https://danklinux.com/docs/
#                   Migrated from Noctalia v5 on 2026-08-03; v5 was still
#                   beta and not ready for daily driving.
#
#  This file only sources the modular fragments below. Put real settings in
#  the matching fragment, not here, so that hot-reload stays predictable.
#
#  Hot reload: SUPER+SHIFT+R  (dispatcher: reload_config)
#  Validate  : ~/.config/mango/validate.sh   (see scripts/validate-config.sh)
#
#  ORDER MATTERS. Later files override earlier ones for scalar keys.
#  Rule-style keys (windowrule/tagrule/layerrule/monitorrule) accumulate
#  instead of overriding, and for those the FIRST match wins.
# =============================================================================

# --- 1. Environment (must come first: consumed at compositor startup) --------
source=~/.config/mango/conf/environment.conf
#  App roles (TERMINAL/BROWSER/FILEMANAGER/...): the ONLY file to edit to
#  swap a default application. See apps.conf for how this works.
source=~/.config/mango/conf/apps.conf

# --- 2. Hardware / outputs --------------------------------------------------
source=~/.config/mango/conf/monitors.conf
source=~/.config/mango/conf/input.conf

# --- 3. Look and feel ------------------------------------------------------
source=~/.config/mango/conf/appearance.conf
source=~/.config/mango/conf/effects.conf
source=~/.config/mango/conf/animations.conf

# --- 4. Window management behaviour ----------------------------------------
source=~/.config/mango/conf/layouts.conf
source=~/.config/mango/conf/behaviour.conf

# --- 5. Rules (order-sensitive: first match wins) --------------------------
source=~/.config/mango/conf/rules-tags.conf
source=~/.config/mango/conf/rules-layers.conf
source=~/.config/mango/conf/rules-windows.conf

# --- 6. Keybindings --------------------------------------------------------
#  Kept last so bindings can reference anything defined above.
#  NOTE (0.15.5 breaking change): if two bindings share the same
#  modifier+key, ONLY THE FIRST is applied. Keep this file conflict-free.
source=~/.config/mango/conf/keybindings.conf

# --- 7. Autostart ----------------------------------------------------------
source=~/.config/mango/conf/autostart.conf

# =============================================================================
#  8. DankMaterialShell managed fragments  (MUST STAY LAST)
# =============================================================================
#  SHELL MIGRATION 2026-08-03: Noctalia v5 -> DankMaterialShell.
#  The old single `source=~/.config/mango/noctalia.conf` line is gone; DMS
#  uses six separate fragments under ~/.config/mango/dms/ instead.
#
#  These files are GENERATED AND OWNED BY DMS. Regenerate with:
#    dms setup colors | layout | cursor | outputs | windowrules | binds
#  Any hand edit is lost on the next regeneration, so do not edit them.
#  They are gitignored for that reason (see .gitignore).
#
#  ORDER MATTERS, in two directions:
#
#  1. LAST for scalar keys. colors.conf and layout.conf set scalar keys
#     (bordercolor, focuscolor, border_radius, gapp*, borderpx) that also
#     appear in conf/appearance.conf. Later assignment wins, so DMS's live
#     matugen-derived palette overrides the static fallback values. That is
#     intentional: appearance.conf documents its colors as fallback-only.
#
#  2. LAST for binds too, but for the opposite reason. mango 0.15.5 applies
#     only the FIRST bind for a given modifier+key and silently discards
#     later duplicates (commit d5a4274). Since binds.conf is sourced after
#     conf/keybindings.conf, a collision would let OUR binding win and
#     silently kill DMS's. That is why all 39 colliding binds were removed
#     from conf/keybindings.conf rather than relying on order. Verified
#     conflict-free: concatenating both files and checking for duplicate
#     MODS+key pairs yields nothing.
#
#  cursor.conf, outputs.conf and windowrules.conf are written by DMS's
#  settings UI (display arrangement, cursor hiding, per-window rules) and
#  start empty until you change something in Settings.
#
#  source-optional= (not source=) so a fresh clone on a machine where
#  `dms setup` has not run yet does not fail to parse. mango treats a
#  missing source= target as an error but silently skips source-optional=.
source-optional=~/.config/mango/dms/colors.conf
source-optional=~/.config/mango/dms/layout.conf
source-optional=~/.config/mango/dms/cursor.conf
source-optional=~/.config/mango/dms/outputs.conf
source-optional=~/.config/mango/dms/windowrules.conf
source-optional=~/.config/mango/dms/binds.conf
