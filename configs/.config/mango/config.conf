# =============================================================================
#  mango - main configuration entry point
# =============================================================================
#  Target version : mango 0.15.5 (github.com/mangowm/mango)
#  Docs           : https://mangowm.github.io/docs/
#  Shell          : Noctalia Shell (Quickshell)
#
#  This file only sources the modular fragments below. Put real settings in
#  the matching fragment, not here, so that hot-reload stays predictable.
#
#  Hot reload: SUPER+SHIFT+R  (dispatcher: reload_config)
#  Validate  : ~/.config/mango/validate.sh   (see scripts/validate-config.sh)
#
#  ORDER MATTERS. Later files override earlier ones for scalar keys.
#  Rule-style keys (windowrule/tagrule/layerrule/monitorrule) accumulate
#  instead of overriding, and for those the FIRST match wins.
# =============================================================================

# --- 1. Environment (must come first: consumed at compositor startup) --------
source=~/.config/mango/conf/environment.conf
#  App roles (TERMINAL/BROWSER/FILEMANAGER/...): the ONLY file to edit to
#  swap a default application. See apps.conf for how this works.
source=~/.config/mango/conf/apps.conf

# --- 2. Hardware / outputs --------------------------------------------------
source=~/.config/mango/conf/monitors.conf
source=~/.config/mango/conf/input.conf

# --- 3. Look and feel ------------------------------------------------------
source=~/.config/mango/conf/appearance.conf
source=~/.config/mango/conf/effects.conf
source=~/.config/mango/conf/animations.conf

# --- 4. Window management behaviour ----------------------------------------
source=~/.config/mango/conf/layouts.conf
source=~/.config/mango/conf/behaviour.conf

# --- 5. Rules (order-sensitive: first match wins) --------------------------
source=~/.config/mango/conf/rules-tags.conf
source=~/.config/mango/conf/rules-layers.conf
source=~/.config/mango/conf/rules-windows.conf

# --- 6. Keybindings --------------------------------------------------------
#  Kept last so bindings can reference anything defined above.
#  NOTE (0.15.5 breaking change): if two bindings share the same
#  modifier+key, ONLY THE FIRST is applied. Keep this file conflict-free.
source=~/.config/mango/conf/keybindings.conf

# --- 7. Autostart ----------------------------------------------------------
source=~/.config/mango/conf/autostart.conf

source=~/.config/mango/noctalia.conf
