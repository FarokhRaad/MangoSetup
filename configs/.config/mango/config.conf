# =============================================================================
#  mango - main configuration entry point
# =============================================================================


# --- 1. Environment --------
source=~/.config/mango/conf/environment.conf
#  App roles (TERMINAL/BROWSER/FILEMANAGER/...)
source=~/.config/mango/conf/apps.conf

# --- 2. Hardware / outputs --------------------------------------------------
source=~/.config/mango/conf/monitors.conf
source=~/.config/mango/conf/input.conf

# --- 3. Look and feel ------------------------------------------------------
source=~/.config/mango/conf/appearance.conf
source=~/.config/mango/conf/effects.conf
source=~/.config/mango/conf/animations.conf

# --- 4. Window management behaviour ----------------------------------------
source=~/.config/mango/conf/layouts.conf
source=~/.config/mango/conf/behaviour.conf

# --- 5. Rules (order-sensitive: first match wins) --------------------------
source=~/.config/mango/conf/rules-tags.conf
source=~/.config/mango/conf/rules-layers.conf
source=~/.config/mango/conf/rules-windows.conf

# --- 6. Keybindings --------------------------------------------------------
source=~/.config/mango/conf/keybindings.conf

# --- 7. Autostart ----------------------------------------------------------
source=~/.config/mango/conf/autostart.conf

# =============================================================================
#  8. DankMaterialShell managed fragments 
# =============================================================================
source-optional=~/.config/mango/dms/colors.conf
source-optional=~/.config/mango/dms/layout.conf
source-optional=~/.config/mango/dms/cursor.conf
source-optional=~/.config/mango/dms/outputs.conf
source-optional=~/.config/mango/dms/windowrules.conf
source-optional=~/.config/mango/dms/binds.conf


