# =============================================================================
#  Autostart
# =============================================================================
#  exec-once= runs ONCE when mango starts.
#  exec=      runs again on EVERY config reload. Use it only for idempotent
#             commands, otherwise SUPER+SHIFT+R spawns duplicate processes.
#
#  MIGRATION NOTE: the previous setup had BOTH a conf/exec.conf and a
#  standalone autostart.sh that started the same programs. Depending on how
#  the session was launched, that could start everything twice. Everything
#  now lives here, in one place.
# =============================================================================

# -----------------------------------------------------------------------------
#  1. Export the session environment to systemd and DBus
# -----------------------------------------------------------------------------
#  env= in environment.conf only reaches mango's own children. systemd user
#  units and DBus-activated services (portals, the shell's lock screen,
#  screen sharing) get their environment from the systemd user manager, so it
#  has to be imported explicitly.
#
#  This MUST run before the portals or the shell start, or screen sharing and
#  file pickers will misbehave.
exec-once=systemctl --user import-environment WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP DESKTOP_SESSION XDG_MENU_PREFIX QT_QPA_PLATFORM QT_QPA_PLATFORMTHEME GDK_BACKEND XCURSOR_THEME XCURSOR_SIZE
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP DESKTOP_SESSION XDG_MENU_PREFIX QT_QPA_PLATFORM QT_QPA_PLATFORMTHEME GDK_BACKEND

# -----------------------------------------------------------------------------
#  2. Restart the XDG desktop portal stack
# -----------------------------------------------------------------------------
#  Portals cache the environment they were started with. If a portal was
#  already running from a previous (KDE) session it will hand out the wrong
#  backend, breaking screen sharing and file dialogs. Restarting after the
#  import above guarantees they pick up the mango environment.
exec-once=systemctl --user restart xdg-desktop-portal.service

# -----------------------------------------------------------------------------
#  3. Polkit authentication agent
# -----------------------------------------------------------------------------
#  Required for any GUI app that asks for elevated privileges. Without an
#  agent, those prompts never appear and the action just fails silently.
#
#  DankMaterialShell ships its OWN polkit agent as part of the shell, so no
#  external agent is required here. Prefer it for a consistent look and
#  leave the line below commented.
#
#  Only enable this external agent if you disable DMS's own, otherwise two
#  agents compete for the same DBus name and prompts become unreliable.
# exec-once=/usr/lib/mate-polkit/polkit-mate-authentication-agent-1

# -----------------------------------------------------------------------------
#  4. Secrets / keyring
# -----------------------------------------------------------------------------
#  Unlocks stored credentials for browsers, mail clients, and VS Code.
exec-once=gnome-keyring-daemon --start --components=secrets,ssh

# -----------------------------------------------------------------------------
#  5. Clipboard history
# -----------------------------------------------------------------------------
#  NOT NEEDED with DankMaterialShell. DMS implements clipboard history
#  internally and hooks the compositor clipboard directly: its IPC exposes a
#  `clipboard` target with open/close/toggle, bound to SUPER+v in DMS's own
#  binds fragment (see keybindings.conf's header).
#
#  Running cliphist alongside it is redundant and means two processes racing
#  to own the same Wayland selection. Only uncomment these if you disable
#  DMS's clipboard and want cliphist to drive an external picker.
#
#  For reference, an external-picker setup requires:
# exec-once=wl-paste --type text --watch cliphist store
# exec-once=wl-paste --type image --watch cliphist store

# -----------------------------------------------------------------------------
#  6. XWayland
# -----------------------------------------------------------------------------
#  mango has built-in XWayland, which is enough for most setups.
#  xwayland-satellite is only needed if you use fractional scaling and want
#  crisp (not blurry) X11 apps. If you enable it, also set env=DISPLAY,:2 in
#  environment.conf and use a display number other than :1.
# exec-once=xwayland-satellite :2

# -----------------------------------------------------------------------------
#  7. Shell: DankMaterialShell (DMS)
# -----------------------------------------------------------------------------
#  Bar, launcher, notifications, OSD, wallpaper, lock screen.
#
#  Started LAST so the environment import and portals are already in place.
#
#  Started via a systemd USER SERVICE bound to mango-session.target, NOT a
#  bare `exec-once=dms run`. Rationale (from danklinux.com/docs installation
#  guide, "Compositor-Specific Systemd Setup -> MangoWC"):
#
#    * mango is a wlroots/dwl-derived compositor with NO native systemd
#      session integration, so the environment must be exported manually
#      (the two exec-once lines above already do this).
#    * Binding dms to mango-session.target instead of `systemctl --user
#      enable dms` means DMS only starts in a mango session. A plain enable
#      would launch it in EVERY user session.
#    * dms.service is Type=dbus on org.freedesktop.Notifications with
#      Restart=on-failure, so a shell crash is recovered automatically.
#      A bare exec-once gets one shot and stays dead.
#
#  Wiring (done once, already applied on this machine):
#    ~/.config/systemd/user/mango-session.target
#    systemctl --user add-wants mango-session.target dms
#
#  DO NOT also add `exec-once=dms run`: the docs warn explicitly that
#  combining systemd autostart with a compositor exec line runs DMS twice.
exec-once=systemctl --user start mango-session.target

# -----------------------------------------------------------------------------
#  8. Dolphin "Open With" menu cache
# -----------------------------------------------------------------------------
#  Builds the XDG menu cache Dolphin needs to populate its Open With
#  submenu. Cheap and idempotent, but only needed once per session.
exec-once=kbuildsycoca6 --noincremental

# -----------------------------------------------------------------------------
#  9. Focus the primary monitor
# -----------------------------------------------------------------------------
#  mango starts with focus on whichever output came up first, which is
#  usually the laptop panel. Move it to the primary monitor instead.
#  Slightly delayed so all outputs are up before the dispatch fires.
exec-once=sh -c 'sleep 1; mmsg dispatch focusmon,HDMI-A-1'

# -----------------------------------------------------------------------------
#  10. User applications
# -----------------------------------------------------------------------------
#  Logitech device manager, started hidden to the tray.
exec-once=solaar -w hide

#  Messenger, started minimised. rules-windows.conf pins it to tag 4 and
#  opens it silently so it does not steal focus at login. Uses the
#  $MESSENGER role from apps.conf; exec-once runs via `sh -c`, so the
#  variable expands normally. --start-in-tray is ferdium-specific: if you
#  swap the role, check the new app's flag for the same behaviour.
exec-once=$MESSENGER --start-in-tray

#  Download manager (uncomment if you use it).
# exec-once=brisk --from-startup

# -----------------------------------------------------------------------------
#  11. Idle management and screen locking
# -----------------------------------------------------------------------------
#  DankMaterialShell handles idle and locking itself: its IPC exposes a `lock`
#  target (lock / lockAndOutputsOff) plus an `inhibit` target for idle
#  inhibition. Do NOT also run swayidle: the two will fight and you get
#  double locking. Left here as a reminder, intentionally disabled.
# exec-once=swayidle -w timeout 600 'dms ipc call lock lock'
