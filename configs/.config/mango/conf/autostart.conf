# =============================================================================
#  Autostart
# =============================================================================
#  exec-once= runs once at startup. exec= re-runs on every config reload, so
#  use it only for idempotent commands.
# =============================================================================

#  Export the session environment to systemd and DBus.
#  DISPLAY and WAYLAND_DISPLAY are included on purpose: mango exports them
#  once before Xwayland has claimed a display number, and never unsets them,
#  so a stale value from a previous session breaks xdg-desktop-portal-gtk.
exec-once=systemctl --user import-environment DISPLAY WAYLAND_DISPLAY XDG_SESSION_DESKTOP DESKTOP_SESSION XDG_MENU_PREFIX QT_QPA_PLATFORM QT_QPA_PLATFORMTHEME GDK_BACKEND ELECTRON_OZONE_PLATFORM_HINT MOZ_ENABLE_WAYLAND
exec-once=dbus-update-activation-environment --systemd --all
# exec-once=dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_SESSION_DESKTOP DESKTOP_SESSION XDG_MENU_PREFIX QT_QPA_PLATFORM QT_QPA_PLATFORMTHEME GDK_BACKEND ELECTRON_OZONE_PLATFORM_HINT MOZ_ENABLE_WAYLAND

#  Restart the portals so they pick up the environment exported above.
# exec-once=systemctl --user restart xdg-desktop-portal.service
# exec-once=systemctl --user try-restart xdg-desktop-portal-gtk.service

#  Secret store and SSH agent.
exec-once=gnome-keyring-daemon --start --components=secrets,ssh

#  Start DankMaterialShell, bound to mango-session.target so it restarts on
#  failure and only runs in a mango session.
#  Do not also add `exec-once=dms run`: that starts the shell twice.
exec-once=systemctl --user start mango-session.target

#  Rebuild the XDG menu cache, which populates Dolphin's "Open With" submenu.
exec-once=kbuildsycoca6 --noincremental

#  Focus the primary monitor at login. Set $PRIMARY_MONITOR in monitors.conf;
#  an empty value is a no-op.
exec-once=sh -c '[ -n "$PRIMARY_MONITOR" ] && { sleep 1; mmsg dispatch focusmon,"$PRIMARY_MONITOR"; }'

#  Logitech device manager, hidden to the tray.
exec-once=solaar -w hide

#  Messenger, minimised to the tray.
#  The ozone flags force Wayland. Drop them if you swap $MESSENGER to a
#  non-Electron app, since Qt apps refuse to start with them.
exec-once=$MESSENGER --start-in-tray --enable-features=UseOzonePlatform --ozone-platform=wayland

#  Download manager, minimised to the tray.
exec-once=motrix-next --autostart

# =============================================================================
#  Disabled
# =============================================================================
#  Polkit agent. DMS ships its own; running two makes prompts unreliable.
# exec-once=/usr/lib/mate-polkit/polkit-mate-authentication-agent-1

#  Clipboard history. DMS handles this internally (SUPER+V).
# exec-once=wl-paste --type text --watch cliphist store
# exec-once=wl-paste --type image --watch cliphist store

#  xwayland-satellite, for crisp X11 apps under fractional scaling.
#  Also set env=DISPLAY,:2 in environment.conf if you enable it.
# exec-once=xwayland-satellite :2

#  Idle and locking. DMS handles both (Settings -> Power).
# exec-once=swayidle -w timeout 600 'dms ipc call lock lock'
