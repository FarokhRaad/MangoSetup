# =============================================================================
#  Monitors
# =============================================================================
#  monitorrule=name:<regex>,width:,height:,refresh:,x:,y:,scale:,rr:,vrr:
#
#    name     regex on connector name, anchor with ^...$ for an exact match
#    make     regex on manufacturer
#    model    regex on model
#    serial   regex on serial
#    width    horizontal resolution in pixels
#    height   vertical resolution in pixels
#    refresh  refresh rate in Hz
#    x, y     position of the output's top-left corner in the layout
#    scale    output scale factor
#    rr       rotation: 0 none, 1 90 CCW, 2 180, 3 270, 4-7 the same flipped
#    vrr      variable refresh rate, 0 or 1
#    hdr      HDR, 0 or 1, also needs env=WLR_RENDERER,vulkan
#    custom   force a custom mode, 0 or 1
#    disable  disable the output, 0 or 1
#
#  If several matchers are set, all of them must match.
#  List connectors and modes with `wlr-randr` or `mmsg -g monitors`.
#
#  x/y are layout coordinates, not raw pixels: a scaled output occupies
#  width/scale. Never use negative values, they break XWayland click routing.
# =============================================================================

#  Output that takes focus at login, read by autostart.conf.
#  A literal name with no regex anchors. Empty on a single-display machine.
env=PRIMARY_MONITOR,HDMI-A-1

#  Laptop panel, leftmost.
monitorrule=name:^eDP-1$,width:2560,height:1600,refresh:165.0,x:0,y:640,scale:1.25,rr:0,vrr:0

#  Middle monitor, mounted in portrait. width/height are the panel's native
#  landscape mode; rr:1 rotates it to a 1200x1920 desktop area.
monitorrule=name:^DP-2$,width:1920,height:1200,refresh:59.95,x:2048,y:0,scale:1,rr:1,vrr:0

#  Right-hand monitor, the primary display.
monitorrule=name:^HDMI-A-1$,width:1920,height:1200,refresh:59.95,x:3248,y:360,scale:1,rr:0,vrr:0

#  Colour depth for outputs with hdr:1. 0 default, 1 HDR8, 2 HDR10.
hdr_depth=2

#  Screen tearing. 0 off, 1 everywhere, 2 fullscreen only.
#  Per-window override: windowrule=force_tearing:1,...
allow_tearing=0
