# =============================================================================
#  Monitor / output configuration
# =============================================================================
#  BREAKING CHANGE (mango 0.15.0+):
#  monitorrule switched from POSITIONAL to KEY:VALUE syntax.
#
#    OLD (no longer parses):
#      monitorrule=eDP-1,0.55,1,scroller,0,1,0,160,2560,1600,165.0
#             name,mfact,nmaster,layout,transform,scale,x,y,w,h,refresh
#
#    NEW:
#      monitorrule=name:^eDP-1$,width:2560,height:1600,refresh:165.0,...
#
#  IMPORTANT: mfact, nmaster and layout are NO LONGER part of monitorrule.
#  They moved to tagrule (see rules-tags.conf) which is strictly better,
#  because it lets you set a different layout per tag per monitor.
#
#  Available keys:
#    name    regex match on connector name (use ^...$ for exact)
#    make    regex match on manufacturer
#    model   regex match on model
#    serial  regex match on serial
#    width   horizontal resolution in pixels
#    height  vertical resolution in pixels
#    refresh refresh rate in Hz (float)
#    x, y    position of the output's top-left corner in the layout
#    scale   output scale factor (float)
#    rr      transform / rotation, 0-7 (see table below)
#    vrr     variable refresh rate, 0 or 1
#    hdr     HDR, 0 or 1 (also requires env=WLR_RENDERER,vulkan)
#    custom  force a custom mode, 0 or 1 (can black-screen some displays)
#    disable disable this output entirely, 0 or 1
#
#  Transform (rr) values:
#    0 = none          4 = flipped
#    1 = 90 CCW        5 = flipped + 90 CCW
#    2 = 180 CCW       6 = flipped + 180 CCW
#    3 = 270 CCW       7 = flipped + 270 CCW
#
#  If any matcher (name/make/model/serial) is set, ALL set matchers must
#  match for the rule to apply.
#
#  Run `wlr-randr` inside a mango session to list connectors, modes,
#  make/model/serial.
# =============================================================================

# -----------------------------------------------------------------------------
#  Physical layout (as migrated from the previous KDE arrangement)
#
#    x=0            x=2048        x=3248
#    +-----------+  +--------+    +-----------+
#    | eDP-1     |  | DP-2   |    | HDMI-A-1  |  <- primary
#    | 2560x1600 |  | rotated|    | 1920x1200 |
#    | @165Hz    |  | 90 CCW |    | @60Hz     |
#    | scale 1.25|  |1920x1200    |           |
#    +-----------+  +--------+    +-----------+
#    y=640          y=0           y=360
#
#  NOTE on eDP-1 scale: KDE used 1.25. Because eDP-1 is scaled and
#  DP-2/HDMI-A-1 are not, x offsets are in LAYOUT coordinates, not raw
#  pixels: 2560 / 1.25 = 2048, so DP-2 starts at x=2048.
#
#  CRITICAL: never use negative x/y. XWayland has a known bug where
#  negative output coordinates break click event routing. Always start at
#  0,0 and grow positive.
# -----------------------------------------------------------------------------

# --- Primary monitor -------------------------------------------------------
#  Which output should own focus (and the pointer) at login. autostart.conf
#  reads this and dispatches `mmsg focusmon` to it, because mango otherwise
#  focuses whichever output came up first, usually the laptop panel.
#
#  Set it to one of the monitorrule names below, WITHOUT the ^...$ regex
#  anchors (focusmon takes a literal output name). Leave it EMPTY on a
#  single-display machine and the focus step becomes a silent no-op.
#  Find your output names with:  mmsg -g monitors    or    wlr-randr
env=PRIMARY_MONITOR,HDMI-A-1

# --- Laptop internal panel (leftmost) --------------------------------------
monitorrule=name:^eDP-1$,width:2560,height:1600,refresh:165.0,x:0,y:640,scale:1.25,rr:0,vrr:0

# --- Middle monitor, physically rotated into portrait ----------------------
#  Panel is a 1920x1200 landscape display mounted in portrait.
#  width/height describe the PANEL's native mode; rr:1 rotates it.
#  Effective desktop area after rotation is 1200x1920.
monitorrule=name:^DP-2$,width:1920,height:1200,refresh:59.95,x:2048,y:0,scale:1,rr:1,vrr:0

# --- Primary monitor (rightmost) ------------------------------------------
monitorrule=name:^HDMI-A-1$,width:1920,height:1200,refresh:59.95,x:3248,y:360,scale:1,rr:0,vrr:0

# --- HDR -------------------------------------------------------------------
#  hdr_depth: 0 = default, 1 = HDR8, 2 = HDR10
#  Only meaningful when a monitorrule above sets hdr:1 AND
#  env=WLR_RENDERER,vulkan is set in environment.conf.
hdr_depth=2

# --- Tearing ---------------------------------------------------------------
#  Global tearing policy (lower latency for games, may show tear lines):
#    0 = disabled, 1 = enabled everywhere, 2 = fullscreen only
#  Per-window override: windowrule=force_tearing:1,...
#  Some GPUs additionally need env=WLR_DRM_NO_ATOMIC,1.
allow_tearing=0

# --- Notes on runtime output control --------------------------------------
#  Turn a monitor off / on / toggle (DPMS, does not remove the output):
#    mmsg dispatch disable_monitor,eDP-1
#    mmsg dispatch enable_monitor,eDP-1
#    mmsg dispatch toggle_monitor,eDP-1
#  Fully remove / re-add an output:
#    wlr-randr --output eDP-1 --off
#    wlr-randr --output eDP-1 --on
