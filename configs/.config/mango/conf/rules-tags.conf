# =============================================================================
#  Tag rules: per-tag, per-monitor layout and behaviour
# =============================================================================
#  Syntax:
#    tagrule=id:N,<option>:<value>,...
#
#  Matchers:
#    id              tag number, 1-9 (required)
#    monitor_name    apply only on this connector
#    monitor_make    apply only on this manufacturer
#    monitor_model   apply only on this model
#    monitor_serial  apply only on this serial
#
#  Options:
#    layout_name                        layout for this tag (see layouts.conf)
#    mfact                              master area fraction, overrides default_mfact
#    nmaster                            master window count, overrides default_nmaster
#    no_hide                            1 = keep the tag listed even when empty
#    no_render_border                   1 = draw no window borders on this tag
#    open_as_floating                   1 = new windows float on this tag
#    scroller_default_proportion        per-tag scroller column width
#    scroller_default_proportion_single per-tag single-window proportion
#    scroller_ignore_proportion_single  per-tag single-window override
#
#  UPSTREAM NOTE (mango 0.15.0): layout/mfact/nmaster used to be positional
#  fields on monitorrule. As of 0.15.0 they belong here instead, which is why
#  each tag is declared once per monitor below.
#
#  Example three-output layout below; change the connector names to match
#  your own (run wlr-randr to list them). The pattern is one tagrule per
#  (tag, output) pair, picking a layout that suits that output's shape:
#    eDP-1     landscape -> scroller
#    DP-2      portrait  -> vertical_scroller
#    HDMI-A-1  landscape -> scroller
#  A single-output setup only needs the first line of each block.
#
#  no_hide:1 on tags 1-3 keeps them permanently listed in the shell's
#  workspace widget so the bar layout does not shift as tags empty out.
# =============================================================================

# --- Tag 1 ------------------------------------------------------------------
tagrule=id:1,monitor_name:eDP-1,layout_name:scroller,no_hide:1
tagrule=id:1,monitor_name:DP-2,layout_name:vertical_scroller,no_hide:1
tagrule=id:1,monitor_name:HDMI-A-1,layout_name:scroller,no_hide:1

# --- Tag 2 ------------------------------------------------------------------
tagrule=id:2,monitor_name:eDP-1,layout_name:scroller,no_hide:1
tagrule=id:2,monitor_name:DP-2,layout_name:vertical_scroller,no_hide:1
tagrule=id:2,monitor_name:HDMI-A-1,layout_name:scroller,no_hide:1

# --- Tag 3 ------------------------------------------------------------------
tagrule=id:3,monitor_name:eDP-1,layout_name:scroller,no_hide:1
tagrule=id:3,monitor_name:DP-2,layout_name:vertical_scroller,no_hide:1
tagrule=id:3,monitor_name:HDMI-A-1,layout_name:scroller,no_hide:1

# --- Tag 4 ------------------------------------------------------------------
tagrule=id:4,monitor_name:eDP-1,layout_name:scroller,no_hide:0
tagrule=id:4,monitor_name:DP-2,layout_name:vertical_scroller,no_hide:0
tagrule=id:4,monitor_name:HDMI-A-1,layout_name:scroller,no_hide:0

# --- Tag 5 ------------------------------------------------------------------
tagrule=id:5,monitor_name:eDP-1,layout_name:scroller,no_hide:0
tagrule=id:5,monitor_name:DP-2,layout_name:vertical_scroller,no_hide:0
tagrule=id:5,monitor_name:HDMI-A-1,layout_name:scroller,no_hide:0

# --- Tag 6 ------------------------------------------------------------------
tagrule=id:6,monitor_name:eDP-1,layout_name:scroller,no_hide:0
tagrule=id:6,monitor_name:DP-2,layout_name:vertical_scroller,no_hide:0
tagrule=id:6,monitor_name:HDMI-A-1,layout_name:scroller,no_hide:0

# --- Tag 7 ------------------------------------------------------------------
tagrule=id:7,monitor_name:eDP-1,layout_name:scroller,no_hide:0
tagrule=id:7,monitor_name:DP-2,layout_name:vertical_scroller,no_hide:0
tagrule=id:7,monitor_name:HDMI-A-1,layout_name:scroller,no_hide:0

# --- Tag 8: media / monocle ------------------------------------------------
#  Single full-size window, no borders: good for video and fullscreen work.
tagrule=id:8,monitor_name:eDP-1,layout_name:monocle,no_hide:0,no_render_border:1
tagrule=id:8,monitor_name:DP-2,layout_name:monocle,no_hide:0,no_render_border:1
tagrule=id:8,monitor_name:HDMI-A-1,layout_name:monocle,no_hide:0,no_render_border:1

# --- Tag 9: scratch / floating --------------------------------------------
#  New windows open floating here. Useful as a dumping ground for dialogs,
#  calculators, and anything you do not want tiled.
tagrule=id:9,monitor_name:eDP-1,layout_name:tile,no_hide:0,open_as_floating:1
tagrule=id:9,monitor_name:DP-2,layout_name:vertical_tile,no_hide:0,open_as_floating:1
tagrule=id:9,monitor_name:HDMI-A-1,layout_name:tile,no_hide:0,open_as_floating:1
