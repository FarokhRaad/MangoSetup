# =============================================================================
#  Animations
# =============================================================================
#  Animation types: zoom, slide, fade, none
#  Curves are cubic-bezier control points: x1,y1,x2,y2
#  Durations are in milliseconds.
# =============================================================================

# -----------------------------------------------------------------------------
#  Master switches
# -----------------------------------------------------------------------------
animations=1

#  Animate layer-shell surfaces (the shell's bar, panels, launcher, OSD).
#  Left OFF because DankMaterialShell runs its own open/close transitions in
#  QML; animating both layers at once looks doubled and feels laggy.
layer_animations=0

# -----------------------------------------------------------------------------
#  Window animation types
# -----------------------------------------------------------------------------
animation_type_open=zoom
animation_type_close=slide

#  Only used when layer_animations=1.
layer_animation_type_open=fade
layer_animation_type_close=fade

# -----------------------------------------------------------------------------
#  Fade
# -----------------------------------------------------------------------------
animation_fade_in=1
animation_fade_out=1

#  Opacity the animation starts from.
fadein_begin_opacity=0.6
fadeout_begin_opacity=0.8

# -----------------------------------------------------------------------------
#  Zoom
# -----------------------------------------------------------------------------
#  Scale a window starts at (open) and ends at (close), as a ratio of final
#  size. 0.3 -> grows in from 30%.
zoom_initial_ratio=0.3
zoom_end_ratio=0.7

# -----------------------------------------------------------------------------
#  Tag switching
# -----------------------------------------------------------------------------
#  Direction of the tag-change slide: 0 = vertical, 1 = horizontal.
tag_animation_direction=0

#  Wrap around from the last tag back to the first when sliding.
tag_carousel=0

# -----------------------------------------------------------------------------
#  Durations (milliseconds)
# -----------------------------------------------------------------------------
animation_duration_move=500
animation_duration_open=400
animation_duration_close=400
animation_duration_tag=500

#  Cross-fade time when focus moves and the focused/unfocused opacity
#  values in effects.conf differ. Set to 0 for instant opacity changes.
animation_duration_focus=400

# -----------------------------------------------------------------------------
#  Curves (cubic-bezier x1,y1,x2,y2)
# -----------------------------------------------------------------------------
#  y values above 1.0 overshoot, giving a slight springy bounce.
animation_curve_open=0.46,1.0,0.29,1.1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1

#  Curves for the opacity fade animations specifically.
animation_curve_opafadein=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
