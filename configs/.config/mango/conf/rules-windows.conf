# =============================================================================
#  Window rules
# =============================================================================
#  Syntax:
#    windowrule=<property>:<value>,...,<matcher>:<regex>
#
#  Matchers (regex; anchor with ^...$ for an exact match):
#    appid   Wayland app_id, or the WM_CLASS of an XWayland client
#    title   window title
#
#  Get the values for a real window with:
#    mmsg get focusing-client
#
#  Common properties:
#    isfloating:0|1          float or tile
#    tags:N                  open on tag N
#    monitor:NAME            open on a specific output
#    width:N  height:N       initial size in pixels (floating only)
#    offsetx:N offsety:N     initial position offset
#    isglobal:0|1            show on every tag
#    isoverlay:0|1           keep above all other windows
#    isfullscreen:0|1        open fullscreen
#    isfakefullscreen:0|1    report fullscreen to the app without resizing
#    isnamedscratchpad:NAME  bind to a named scratchpad
#    isopensilent:0|1        open without stealing focus
#    istagsilent:0|1         open on its tag without switching to it
#    nofocus:0|1             never take focus
#    noblur:0|1              disable blur for this window
#    isnoshadow:0|1          disable shadow
#    isnoborder:0|1          disable border
#    isnoradius:0|1          disable rounded corners
#    isnoanimation:0|1       disable animations
#    noswallow:0|1           exclude from terminal swallowing
#    isterm:0|1              mark as a terminal (enables swallowing)
#    focused_opacity:F       per-window focused opacity
#    unfocused_opacity:F     per-window unfocused opacity
#    force_tearing:0|1       force tearing for this window (games)
#    vrr_only_fullscreen:0|1 only use VRR when fullscreen
#    force_tiled_state:0|1   refuse the app's floating request
#    ignore_maximize:0|1     ignore maximize requests
#    ignore_minimize:0|1     ignore minimize requests
#    idleinhibit_when_focus:0|1  block idle/lock while focused
#    shield_when_capture:0|1 hide from screen recordings
#    scroller_proportion:F   column width in the scroller layout
#
#  ORDERING: the FIRST matching rule wins, so specific rules must come
#  BEFORE broad ones. Rules are grouped from most to least specific.
# =============================================================================

# =============================================================================
#  1. Security and privacy
# =============================================================================
#  Password managers: float, and hide from screen capture.
windowrule=isfloating:1,shield_when_capture:1,appid:^(Bitwarden|bitwarden)$
windowrule=isfloating:1,shield_when_capture:1,appid:^org.keepassxc.KeePassXC$

#  Polkit authentication prompts: float, centered, always on top.
#  These must never be tiled or they can be missed entirely.
windowrule=isfloating:1,isoverlay:1,appid:^polkit-(gnome|mate)-authentication-agent-1$
windowrule=isfloating:1,isoverlay:1,appid:^org.kde.polkit-kde-authentication-agent-1$
windowrule=isfloating:1,isoverlay:1,appid:^lxqt-policykit-agent$
windowrule=isfloating:1,isoverlay:1,appid:^xfce-polkit$

# =============================================================================
#  2. Portals and system dialogs
# =============================================================================
#  File pickers and portal dialogs must float.
windowrule=isfloating:1,appid:^xdg-desktop-portal(-gtk|-kde|-wlr)?$

# =============================================================================
#  3. Picture-in-Picture
# =============================================================================
#  Small always-on-top video overlay. isoverlay keeps it above other windows,
#  isglobal makes it follow you across tags, nofocus stops it stealing focus.
windowrule=isfloating:1,isoverlay:1,isglobal:1,nofocus:1,width:640,height:360,title:^Picture-in-Picture$
windowrule=isfloating:1,isoverlay:1,isglobal:1,nofocus:1,width:640,height:360,title:Picture in picture

# =============================================================================
#  4. Media
# =============================================================================
#  mpv: float at a sane size, no rounded corners (they clip video), and
#  inhibit idle/lock while it has focus so the screen never blanks mid-film.
windowrule=isfloating:1,width:1280,height:720,isnoradius:1,idleinhibit_when_focus:1,appid:^mpv$
windowrule=isfloating:1,isnoradius:1,idleinhibit_when_focus:1,appid:^vlc$

#  Image viewers.
windowrule=isfloating:1,width:1280,height:800,appid:^qimgv$
windowrule=isfloating:1,appid:^org.kde.gwenview$,title:^(Configure|Print|Properties)
#  Okular document viewer dialogs.
windowrule=isfloating:1,appid:^org.kde.okular$,title:^(Configure|Print|Properties|Embedded Files|Annotations)
#  Spectacle screenshot tool (kept, though Noctalia has its own capture).
windowrule=isfloating:1,appid:^org.kde.spectacle$
#  KDE Connect popups.
windowrule=isfloating:1,appid:^org.kde.kdeconnect.*

# =============================================================================
#  5. Communication
# =============================================================================
#  Pinned to tag 4, opens without pulling focus away.
#  NOTE: window rules match a literal appid, so they CANNOT reference the
#  $MESSENGER role variable from apps.conf the way keybindings can; mango
#  has no variable expansion in windowrule matchers. If you swap the
#  messenger app in apps.conf, update the appid here too, or run
#  scripts/swap-app.sh which reminds you to.
windowrule=tags:4,istagsilent:1,appid:^ferdium$

# =============================================================================
#  5b. Terminal
# =============================================================================
#  Mark Konsole as a terminal so window swallowing works: launching a GUI app
#  from the shell hides the terminal until that app exits.
windowrule=isterm:1,appid:^org.kde.konsole$

# =============================================================================
#  6. Utilities that should always float
# =============================================================================
windowrule=isfloating:1,appid:^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrule=isfloating:1,appid:^org.pipewire.Helvum$
windowrule=isfloating:1,appid:^com.github.wwmm.easyeffects$
windowrule=isfloating:1,appid:^blueman-manager$
windowrule=isfloating:1,appid:^nm-connection-editor$
windowrule=isfloating:1,appid:^solaar$
windowrule=isfloating:1,appid:^org.kde.ark$
windowrule=isfloating:1,appid:^nwg-look$
windowrule=isfloating:1,appid:^(qt5ct|qt6ct)$
windowrule=isfloating:1,appid:^org.kde.kcalc$
windowrule=isfloating:1,appid:^(qalculate-gtk|io.github.Qalculate.qalculate-qt)$
windowrule=isfloating:1,appid:^org.gnome.Calculator$

#  Download managers.
windowrule=isfloating:1,appid:^(gopeed|brisk)$
windowrule=isfloating:1,appid:^com.github.persepolisdm.persepolis$

#  VPN / proxy client.
windowrule=isfloating:1,appid:^Throne$

#  Screenshot tools.
#  Screenshot tools. Spectacle is handled above in the media section.
windowrule=isfloating:1,appid:^(flameshot|org.gnome.Screenshot)$

# =============================================================================
#  7. Games: tearing and VRR
# =============================================================================
#  Uncomment and adapt per game. force_tearing needs allow_tearing>=1 in
#  monitors.conf; some GPUs also need env=WLR_DRM_NO_ATOMIC,1.
# windowrule=isfullscreen:1,force_tearing:1,vrr_only_fullscreen:1,appid:^steam_app_.*$
# windowrule=isfloating:1,appid:^steam$,title:^Friends List$

# =============================================================================
#  8. Application dialogs (float transient windows, keep main window tiled)
# =============================================================================
#  Matching on title only, so these apply across every toolkit. Kept last
#  because the title patterns are broad.

# --- LibreOffice -----------------------------------------------------------
windowrule=isfloating:1,appid:^libreoffice,title:^(Save|Open|Print|Export|Insert|Format|Options|Preferences|Find|Replace)
windowrule=isfloating:1,appid:^soffice,title:^(Save|Open|Print|Export)

# --- Browsers --------------------------------------------------------------
windowrule=isfloating:1,appid:^(microsoft-edge|microsoft-edge-stable|brave-browser|chromium|google-chrome|vivaldi-stable|helium)$,title:^(Save|Save As|Open File|Open Folder)
windowrule=isfloating:1,appid:^(firefox|zen|floorp)$,title:^(Library|Page Info|Extension:|Opening)

# --- Editors and IDEs -----------------------------------------------------
windowrule=isfloating:1,appid:^(code|code-oss|codium)$,title:^(Open File|Open Folder|Save As)

# --- File managers --------------------------------------------------------
#  Dolphin progress and property dialogs.
windowrule=isfloating:1,appid:^org.kde.dolphin$,title:^(Copying|Moving|Renaming|Deleting|Extracting|Compressing|Opening|Moving to Trash|Emptying Trash|Properties)
windowrule=isfloating:1,appid:^org.gnome.Nautilus$,title:^(Properties|Preferences)
windowrule=isfloating:1,appid:^thunar$,title:^(File Operation Progress|Confirm|Properties)

# --- Creative tools -------------------------------------------------------
windowrule=isfloating:1,appid:^gimp,title:^(Open Image|Export Image|Save|Preferences|Keyboard Shortcuts|Quit)
windowrule=isfloating:1,appid:^org.kde.kdenlive$,title:^(Render|Project Settings|Configure)
windowrule=isfloating:1,appid:^com.obsproject.Studio$,title:^(Settings|Filters|Properties|Add Source)

# --- Mail -----------------------------------------------------------------
windowrule=isfloating:1,appid:^thunderbird$,title:^(Write:|Preferences|Account Settings|Address Book)

# --- Torrent --------------------------------------------------------------
windowrule=isfloating:1,appid:^org.qbittorrent.qBittorrent$,title:^(Options|Add New Torrent)

# --- Virtualisation -------------------------------------------------------
#  idleinhibit_when_focus stops the host locking while you work in a VM.
#  allow_shortcuts_inhibit lets the guest capture key combos.
windowrule=isfloating:1,appid:^virt-manager$,title:^(New VM|Preferences)
windowrule=idleinhibit_when_focus:1,allow_shortcuts_inhibit:1,appid:^virt-viewer$

# --- Generic cross-toolkit dialogs (broadest, intentionally last) ---------
#  Catches most "pick a file" and small modal windows that do not set a
#  transient hint mango can detect.
windowrule=isfloating:1,title:^(Open File|Open Files|Save File|Save As|Select File|Choose File|Select Folder|Choose Folder)$
windowrule=isfloating:1,title:^(Preferences|Settings|About|Confirm|Warning|Error|Authentication Required)$
