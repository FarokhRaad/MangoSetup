# =============================================================================
#  Appearance: gaps, borders, colors
# =============================================================================
#  Visual effects (blur, shadows, opacity, corner radius) live in
#  effects.conf. Animations live in animations.conf.
#
#  NOTE: the previous setup had BOTH appearance.conf and decoration.conf
#  containing the same keys, but config.conf only sourced appearance.conf.
#  decoration.conf was dead weight and has been removed here.
#
#  ###########################################################################
#  # LIVE THEME OVERRIDE: if you enabled the "mango" id in                   #
#  # configs/.config/noctalia/config.toml's [theme.templates].builtin_ids    #
#  # (it is enabled by default in this repo), Noctalia writes                #
#  # ~/.config/mango/noctalia.conf with colors derived from your current     #
#  # wallpaper/palette and appends `source=~/.config/mango/noctalia.conf`    #
#  # to config.conf, AFTER this file in the load order. Because later        #
#  # source= files win for scalar keys, every *color key below is           #
#  # overridden the moment that template applies (switching wallpaper,      #
#  # toggling dark/light, or first shell startup).                          #
#  #                                                                         #
#  # The colors below still matter as the FALLBACK before Noctalia's first  #
#  # run, and as a reference if you disable that template id. Gaps, border  #
#  # width, cursor and the overview/group-bar decoration blocks further     #
#  # down are NOT touched by the template and always apply as written.      #
#  ###########################################################################
# =============================================================================

# -----------------------------------------------------------------------------
#  Gaps
# -----------------------------------------------------------------------------
#  Inner gaps: between adjacent windows.
gappih=8
gappiv=8

#  Outer gaps: between windows and the screen edge.
gappoh=5
gappov=5

#  Suppress gaps when only one window is on the tag (0 = always gap).
smartgaps=0

# -----------------------------------------------------------------------------
#  Scratchpad size
# -----------------------------------------------------------------------------
#  Scratchpad window size as a fraction of the output.
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

# -----------------------------------------------------------------------------
#  Borders
# -----------------------------------------------------------------------------
#  Border thickness in pixels. 0 disables borders entirely.
borderpx=2

#  Hide the border when a window is the only one on its tag.
no_border_when_single=0

# -----------------------------------------------------------------------------
#  Colors  (format: 0xRRGGBBAA)
# -----------------------------------------------------------------------------
#  Desktop background, visible where no window covers it. Noctalia normally
#  paints its own wallpaper layer on top of this.
rootcolor=0x201b14ff

#  Border of unfocused windows.
bordercolor=0x3c3836ff

#  Border of the focused window.
focuscolor=0xaaaaaaaa

#  Border of a window maximized to the screen.
maximizescreencolor=0xaaaaaaaa

#  Border of a window flagged urgent.
urgentcolor=0xad401fff

#  Border of a window in the scratchpad.
scratchpadcolor=0xc4939dff

#  Border of a "global" window (shown on every tag).
globalcolor=0x8d64cfff

#  Border of an overlay / always-on-top window.
overlaycolor=0x89aa61ff

#  Drop target indicator while drag-tiling a window.
dropcolor=0x8fba7c55

#  Split direction indicator in the dwindle layout.
splitcolor=0xeb441eff

# -----------------------------------------------------------------------------
#  Cursor
# -----------------------------------------------------------------------------
#  Keep in sync with XCURSOR_THEME / XCURSOR_SIZE in environment.conf.
cursor_theme=breeze_cursors
cursor_size=24

# -----------------------------------------------------------------------------
#  Overview mode label styling (0.15.0+ jump mode)
# -----------------------------------------------------------------------------
#  Labels drawn over windows in overview when using togglejump, letting you
#  select a window by typing its label.
jump_label_decorate_bg_color=0x201b14ee
jump_label_decorate_fg_color=0xebdbb2ff
jump_label_decorate_focus_bg_color=0xaaaaaaff
jump_label_decorate_focus_fg_color=0x201b14ff
jump_label_decorate_border_color=0x3c3836ff
jump_label_decorate_border_width=2
jump_label_decorate_corner_radius=8
jump_label_decorate_font_desc=JetBrainsMono Nerd Font Bold 20
jump_label_decorate_padding_x=12
jump_label_decorate_padding_y=8

# -----------------------------------------------------------------------------
#  Window group tab bar (0.15.0+ window grouping)
# -----------------------------------------------------------------------------
#  Tab strip shown above grouped windows (see groupjoin / groupleave).
group_bar_height=24
group_bar_decorate_bg_color=0x201b14ff
group_bar_decorate_fg_color=0xa89984ff
group_bar_decorate_focus_bg_color=0x3c3836ff
group_bar_decorate_focus_fg_color=0xebdbb2ff
group_bar_decorate_border_color=0x3c3836ff
group_bar_decorate_border_width=1
group_bar_decorate_corner_radius=6
group_bar_decorate_font_desc=JetBrainsMono Nerd Font 10
group_bar_decorate_padding_x=8
group_bar_decorate_padding_y=4
