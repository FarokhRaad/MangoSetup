# =============================================================================
#  Visual effects: corner radius, opacity, blur, shadows
# =============================================================================
#  Powered by scenefx, and the most GPU-expensive settings in mango.
#  To reduce load: fewer blur passes, then blur_layer=0, then shadows=0.
# =============================================================================

# -----------------------------------------------------------------------------
#  Rounded corners
# -----------------------------------------------------------------------------
#  Corner radius in pixels. 0 = square corners.
border_radius=20

#  Drop the radius when a window is alone on its tag.
no_radius_when_single=0

# -----------------------------------------------------------------------------
#  Opacity
# -----------------------------------------------------------------------------
#  0.0 = fully transparent, 1.0 = fully opaque.
focused_opacity=1.0
unfocused_opacity=0.8

# -----------------------------------------------------------------------------
#  Blur
# -----------------------------------------------------------------------------
#  Blur whatever is behind translucent windows.
blur=1

#  Blur behind layer-shell surfaces: the bar, panels and launcher.
blur_layer=1

#  Cheaper blur path at slightly lower quality.
blur_optimized=0

#  Downsample/upsample passes, 1-10. Higher is softer and slower.
blur_params_num_passes=2

#  Blur kernel radius in pixels.
blur_params_radius=5

#  Grain added to the blurred result, which masks gradient banding.
blur_params_noise=0.02

#  Post-blur color adjustments (1.0 = unchanged).
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.0

# -----------------------------------------------------------------------------
#  Shadows
# -----------------------------------------------------------------------------
shadows=1

#  Shadows on layer-shell surfaces: the bar and panels.
layer_shadows=0

#  Restrict shadows to floating windows.
shadow_only_floating=0

#  Shadow spread and softness in pixels.
shadows_size=4
shadows_blur=12

#  Shadow offset. 0,0 = centered under the window.
shadows_position_x=2
shadows_position_y=2

shadowscolor=0x000000ff
