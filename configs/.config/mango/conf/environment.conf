# =============================================================================
#  Environment variables exported into the mango session
# =============================================================================
#  Syntax: env=NAME,VALUE
#
#  These are set before clients start. Anything that must be visible to
#  systemd user units or DBus-activated services ALSO needs to be imported
#  in autostart.conf, because env= only affects mango's own children.
#
#  Changes here require a full re-login, not just reload_config.
# =============================================================================

# --- Session identity ------------------------------------------------------
#  CRITICAL: Noctalia detects the compositor at startup, in this order
#  (src/compositors/compositor_detect.cpp):
#    1. MANGO_INSTANCE_SIGNATURE is set and non-empty  -> Mango
#    2. XDG_CURRENT_DESKTOP contains "mango"            -> Mango
#
#  mango exports MANGO_INSTANCE_SIGNATURE itself, so detection usually
#  succeeds on rule 1 alone. Setting XDG_CURRENT_DESKTOP=mango is the
#  belt-and-braces second path, and it also tells other apps and the XDG
#  portals which session they are in.
#
#  Older configs set this to "wlroots", which matches NEITHER rule. Noctalia
#  then falls back to a generic ext-workspace backend and you silently lose
#  tag and window-list integration in the bar: it still starts and looks
#  fine, so the failure is easy to miss.
#
#  Detection happens ONCE at startup, so changes need a full re-login.
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland
env=XDG_SESSION_DESKTOP,mango
env=DESKTOP_SESSION,mango

# --- Default applications --------------------------------------------------
#  App choices (terminal, browser, file manager, editor, ...) live in
#  apps.conf, sourced separately, so swapping one app never means editing
#  this file. See apps.conf for the full list and scripts/swap-app.sh to
#  change one from the command line.

# --- Cursor ----------------------------------------------------------------
#  Keep in sync with cursor_theme / cursor_size in appearance.conf.
#  XCURSOR_* covers XWayland and toolkits that ignore the Wayland protocol.
env=XCURSOR_THEME,breeze_cursors
env=XCURSOR_SIZE,24

# --- Qt --------------------------------------------------------------------
#  Prefer Wayland, fall back to X11 so Qt apps never fail to start outright.
env=QT_QPA_PLATFORM,wayland;xcb
#  qt6ct drives Qt theming. Requires qt6ct installed and configured.
env=QT_QPA_PLATFORMTHEME,qt6ct
#  Let Qt honour per-output scale factors reported by the compositor.
env=QT_AUTO_SCREEN_SCALE_FACTOR,1
#  Disable Qt's own client-side window decorations; mango draws borders.
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1

# --- GTK -------------------------------------------------------------------
env=GDK_BACKEND,wayland,x11

# --- Dolphin "Open With" menu ---------------------------------------------
#  Arch installs XDG menu files under an "arch-" prefix. Without this,
#  Dolphin's Open With submenu comes up empty.
#  Also requires archlinux-xdg-menu installed and kbuildsycoca6 run once
#  (handled in autostart.conf).
env=XDG_MENU_PREFIX,arch-

# --- Firefox / Mozilla ----------------------------------------------------
env=MOZ_ENABLE_WAYLAND,1

# --- Electron / Chromium --------------------------------------------------
#  "auto" lets Electron pick Wayland when available without hard-failing
#  on apps that still need XWayland.
env=ELECTRON_OZONE_PLATFORM_HINT,auto

# =============================================================================
#  NVIDIA (RTX 3050 Ti Mobile, nvidia-open-dkms)
# =============================================================================
#  Required for correct GBM/Wayland behaviour on the proprietary/open driver.
env=GBM_BACKEND,nvidia-drm
env=__GLX_VENDOR_LIBRARY_NAME,nvidia
#  Hardware video decode through NVDEC via VA-API.
#  Needs libva-nvidia-driver installed.
env=LIBVA_DRIVER_NAME,nvidia
env=NVD_BACKEND,direct
#  Allow adaptive sync / VRR where the monitor and driver support it.
#  Per-output VRR is enabled separately via vrr:1 in monitors.conf.
env=__GL_GSYNC_ALLOWED,1
env=__GL_VRR_ALLOWED,1

# --- Troubleshooting toggles (leave commented unless needed) ---------------
#  Some GPUs need this to enable tearing, or to work around syncobj crashes
#  in apps like kitty. Uncomment and re-login if you hit either problem.
# env=WLR_DRM_NO_ATOMIC,1
#  Pin mango to a specific GPU if you get a black screen on a hybrid system.
# env=WLR_DRM_DEVICES,/dev/dri/card1
#  Vulkan renderer is REQUIRED if you enable hdr:1 on any monitor.
# env=WLR_RENDERER,vulkan
