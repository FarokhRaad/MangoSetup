# =============================================================================
#  Environment variables
# =============================================================================
#  Syntax: env=NAME,VALUE
#
#  These reach mango's own children only. Anything systemd user units or
#  DBus-activated services need must also be imported in autostart.conf.
#  Changes require a re-login, not just reload_config.
# =============================================================================

#  Session identity. Toolkits and the shell identify the compositor from
#  these. Do not use "wlroots" for XDG_CURRENT_DESKTOP: DMS then falls back
#  to a generic backend and silently loses tag integration in the bar.
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland
env=XDG_SESSION_DESKTOP,mango
env=DESKTOP_SESSION,mango

#  Cursor. Covers XWayland and toolkits that ignore the Wayland protocol.
#  Keep in sync with cursor_theme and cursor_size in appearance.conf.
env=XCURSOR_THEME,breeze_cursors
env=XCURSOR_SIZE,24

#  Qt: prefer Wayland, fall back to X11 so apps never fail to start.
env=QT_QPA_PLATFORM,wayland;xcb
#  Qt theming engine. Needs qt6ct-kde installed.
env=QT_QPA_PLATFORMTHEME,qt6ct
#  Honour per-output scale factors from the compositor.
env=QT_AUTO_SCREEN_SCALE_FACTOR,1
#  Suppress Qt's client-side decorations; mango draws the borders.
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1

#  GTK: prefer Wayland, fall back to X11.
env=GDK_BACKEND,wayland,x11

#  XDG menu prefix. Arch installs menu files with an "arch-" prefix, and
#  without this Dolphin's "Open With" submenu is empty. Needs
#  archlinux-xdg-menu installed.
env=XDG_MENU_PREFIX,arch-

#  Firefox on Wayland.
env=MOZ_ENABLE_WAYLAND,1

#  Electron on Wayland. "auto" avoids hard-failing apps that still need X11.
env=ELECTRON_OZONE_PLATFORM_HINT,auto

# =============================================================================
#  NVIDIA
# =============================================================================
#  Delete this block on AMD or Intel.

#  GBM/Wayland behaviour on the nvidia and nvidia-open drivers.
env=GBM_BACKEND,nvidia-drm
env=__GLX_VENDOR_LIBRARY_NAME,nvidia

#  Hardware video decode via NVDEC. Needs libva-nvidia-driver.
env=LIBVA_DRIVER_NAME,nvidia
env=NVD_BACKEND,direct

#  Allow adaptive sync. Per-output VRR is set with vrr:1 in monitors.conf.
env=__GL_GSYNC_ALLOWED,1
env=__GL_VRR_ALLOWED,1

# =============================================================================
#  Disabled
# =============================================================================
#  Enables tearing on some GPUs, and works around syncobj crashes in kitty.
# env=WLR_DRM_NO_ATOMIC,1

#  Pin mango to one GPU if a hybrid system black-screens.
# env=WLR_DRM_DEVICES,/dev/dri/card1

#  Required if any monitorrule sets hdr:1.
# env=WLR_RENDERER,vulkan
