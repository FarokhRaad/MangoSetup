# =============================================================================
#  Layouts
# =============================================================================
#  Valid layout names (from src/layout/layout.h):
#    tile              T    classic master + stack
#    scroller          S    horizontal scrolling columns
#    vertical_scroller VS   vertical scrolling rows
#    grid              G    even grid
#    vertical_grid     VG
#    monocle           M    one full-size window at a time
#    deck              K    master + stacked "deck" of the rest
#    vertical_deck     VK
#    center_tile       CT   master centered, stack on both sides
#    right_tile        RT   master on the right
#    vertical_tile     VT
#    dwindle           DW   spiral / binary split (i3-like)
#    fair              F    equal-area split
#    vertical_fair     VF
#
#  Per-tag and per-monitor layout assignment lives in rules-tags.conf.
# =============================================================================

# -----------------------------------------------------------------------------
#  Layout cycling
# -----------------------------------------------------------------------------
#  Order used by the switch_layout dispatcher (SUPER+CTRL+N).
#  Trimmed to the layouts actually worth cycling through day to day; the
#  previous list had 10 entries which made cycling impractical.
circle_layout=scroller,tile,monocle,grid,dwindle

# -----------------------------------------------------------------------------
#  Scroller layout
# -----------------------------------------------------------------------------
#  Width of each column as a fraction of the screen.
scroller_default_proportion=0.5

#  Proportion used when a single window occupies the tag.
scroller_default_proportion_single=1.0

#  Force scrolling behaviour even with one window (0 = respect proportion).
scroller_ignore_proportion_single=0

#  Presets cycled by switch_proportion_preset (SUPER+R).
scroller_proportion_preset=0.5,0.8,1.0

#  Maximum number of columns kept in the scroller ring.
scroller_structs=5

#  Keep the focused column horizontally centered.
scroller_focus_center=0

#  Prefer placing new windows toward the center.
scroller_prefer_center=0

#  Let the stack overspread available space.
scroller_prefer_overspread=0

#  Focus a column by moving the pointer to the screen edge.
edge_scroller_pointer_focus=1

#  Minimum pointer speed required to trigger edge focus. 0.0 = no limit.
#  Raise this if edge focus fires accidentally while you move the mouse.
edge_scroller_focus_allow_speed=0.0

# -----------------------------------------------------------------------------
#  Master-stack layouts (tile, deck, center_tile, right_tile)
# -----------------------------------------------------------------------------
#  Fraction of the screen given to the master area.
default_mfact=0.5

#  Number of windows in the master area.
default_nmaster=1

#  New windows become master instead of joining the stack.
new_is_master=1

#  center_tile: let the master area overspread when the stack is small.
center_master_overspread=0

#  center_tile: center a lone stack window instead of pinning it to a side.
center_when_single_stack=1

# -----------------------------------------------------------------------------
#  Dwindle layout
# -----------------------------------------------------------------------------
#  Split ratio for each new division.
dwindle_split_ratio=1.0

#  Choose split direction automatically from the window's aspect ratio.
dwindle_smart_split=0

#  Require an explicit dwindle_split_* / dwindle_toggle_split_direction
#  binding to decide the next split direction.
dwindle_manual_split=0

#  Allow horizontal / vertical splits.
dwindle_hsplit=1
dwindle_vsplit=1

#  Keep the split direction when a sibling window closes.
dwindle_preserve_split=0

#  Collapse trivial single-child splits.
dwindle_drop_simple_split=1

#  Resize neighbours proportionally rather than one at a time.
dwindle_smart_resize=0

# -----------------------------------------------------------------------------
#  Overview mode
# -----------------------------------------------------------------------------
#  Gaps used while in overview.
overviewgappi=5
overviewgappo=15

#  Cycle windows with Tab while overview is open.
ov_tab_mode=1

#  Show windows at their real size instead of scaling them to fit.
ov_no_resize=1

#  Hot corner / hot edge that opens overview when the pointer touches it.
enable_hotarea=0
hotarea_size=10

#  Which corner the hot area occupies: 0 = top-left, 1 = top-right,
#  2 = bottom-left, 3 = bottom-right.
hotarea_corner=0
