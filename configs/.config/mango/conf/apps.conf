# =============================================================================
#  App roles: swap terminal / browser / file manager / editor in ONE place
# =============================================================================
#  This is the ONLY file you should need to edit to change your default
#  applications. Nothing else in this repo hardcodes an app name; every
#  binding and autostart line below references a ROLE, not a literal binary.
#
#  HOW THIS WORKS (verified against the mango 0.15.5 source):
#    mango's `spawn` dispatcher runs each argument through wordexp(), the
#    POSIX word-expansion function, before execvp(). wordexp() performs the
#    same $VARIABLE substitution a shell does. So `spawn,$TERMINAL` really
#    does read the TERMINAL environment variable at the moment the key is
#    pressed, using whatever env= set below.
#
#    mango's `env=NAME,VALUE` calls setenv() in mango's own process, and
#    reload_config re-applies it. Every child mango spawns (via spawn AND
#    spawn_shell) inherits that environment, so changing a role here and
#    pressing SUPER+SHIFT+R (reload_config) takes effect immediately, no
#    logout required.
#
#  WHAT THIS CANNOT COVER: window RULES (rules-windows.conf) match a
#  specific appid/title, which is inherent to how the compositor identifies
#  windows; mango has no equivalent of "float $FILEMANAGER's dialogs".
#  Swapping an app via this file changes what launches; if the new app's
#  window rules should differ (its own dialog titles, floating quirks),
#  scripts/swap-app.sh prints a reminder and rules-windows.conf documents
#  each app's block so you can find and adjust it.
#
#  To swap an app: change the value below, run
#    scripts/swap-app.sh <role> <new-command>
#  which validates the target exists, updates this file, and offers to
#  install it if missing. Editing this file directly and reloading also
#  works; the script is just a guided version of that.
# =============================================================================

# --- Terminal ----------------------------------------------------------------
#  Used by: keybindings.conf (SUPER+Return), autostart, and any spawn_shell
#  script in this repo that opens an interactive shell.
#  Shipped default: kitty. Change via the setup.sh app picker or
#  scripts/swap-app.sh.
#  Other tested options: konsole, alacritty, foot, wezterm.
env=TERMINAL,kitty

#  Some terminals need a flag to run a command and stay open, or to launch
#  detached. Only needed if you swap to something unusual; konsole/kitty/
#  alacritty all work with the plain `spawn,$TERMINAL` form.
# env=TERMINAL_EXEC_FLAG,-e

# --- Login shell ---------------------------------------------------------------
#  The interactive shell your terminal opens. This variable is DECLARATIVE: it
#  records which shell this setup considers active, and the setup.sh picker
#  keeps it in sync with what you actually chose.
#
#  IMPORTANT: exporting SHELL here does NOT change your login shell. The login
#  shell lives in /etc/passwd and is changed with `chsh -s /usr/bin/zsh`, which
#  the picker offers to run for you (it needs your password and only takes
#  effect on the next login). If you set this by hand, run chsh too or the two
#  will disagree.
#
#  Shipped default: bash, because it is the one shell guaranteed present on a
#  fresh Arch install. The repo ships configs for both bash and zsh
#  (.bashrc + .config/bashrc/, .zshrc + .config/zshrc/).
env=SHELL,bash

# --- Browser -------------------------------------------------------------------
#  Used by: keybindings.conf (SUPER+B), BROWSER env consumed by many
#  freedesktop apps (xdg-open, mimeapps.list fallback) as well.
#  Shipped default: microsoft-edge-stable.
#  Other tested options: firefox, brave, chromium, zen, floorp, vivaldi.
env=BROWSER,microsoft-edge-stable

# --- File manager --------------------------------------------------------------
#  Used by: keybindings.conf (SUPER+E).
#  Shipped default: dolphin. Change via the setup.sh app picker or
#  scripts/swap-app.sh; see packages/app-catalog.txt for alternatives.
#  Other tested options: thunar, nautilus, pcmanfm-qt, nemo.
env=FILEMANAGER,dolphin

# --- Editor ----------------------------------------------------------------
#  Used by: EDITOR/VISUAL are read by countless CLI tools (git, sudoedit,
#  crontab -e), and keybindings.conf SUPER+C for the GUI editor.
#  These are deliberately split: EDITOR/VISUAL are terminal-based (git commit
#  messages should not pop up a GUI window), GUI_EDITOR is the app icon.
env=EDITOR,code
env=VISUAL,nvim
env=GUI_EDITOR,code

# --- Messenger / chat --------------------------------------------------------
#  Used by: autostart.conf (tray-minimised launch), rules-windows.conf tag
#  pinning, keybindings.conf SUPER+F.
env=MESSENGER,ferdium

# --- Image viewer ------------------------------------------------------------
#  Used by: mimeapps.list generation in 20-symlink.sh and rules-windows.conf.
#  Default: qimgv
env=IMAGEVIEWER,org.kde.gwenview

# --- Document / PDF viewer --------------------------------------------------
#  Default: okular
env=DOCVIEWER,okular

# --- Media player --------------------------------------------------------------
#  Used by: mimeapps.list generation in 20-symlink.sh and rules-windows.conf.
#  Default: mpv
env=MEDIAPLAYER,mpv

# --- Archive manager ---------------------------------------------------------
#  Default: ark 
env=ARCHIVEMANAGER,ark
