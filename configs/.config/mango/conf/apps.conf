# =============================================================================
#  App roles
# =============================================================================
#  Keybindings, autostart and window rules reference $ROLE rather than a
#  binary name, so this is the only file to edit to change a default app.
#  mango expands these on spawn, so SUPER+SHIFT+R applies a change immediately.
#
#  scripts/swap-app.sh <role> <command> does the same with validation.
#  Window rules match a literal appid, so those still need editing by hand in
#  rules-windows.conf.
# =============================================================================

#  Terminal emulator. Launched by SUPER+Return.
env=TERMINAL,kitty

#  Flag some terminals need to run a command and stay open.
# env=TERMINAL_EXEC_FLAG,-e

#  Interactive shell. Declarative only: the real login shell lives in
#  /etc/passwd and is changed with `chsh -s /usr/bin/zsh`.
env=SHELL,bash

#  Web browser. Launched by SUPER+B, and read by xdg-open and friends.
env=BROWSER,microsoft-edge-stable

#  File manager. Launched by SUPER+E.
env=FILEMANAGER,dolphin

#  Editors. EDITOR and VISUAL are read by git, sudoedit and other CLI tools,
#  so they stay terminal-based; GUI_EDITOR is launched by SUPER+C.
env=EDITOR,code
env=VISUAL,nvim
env=GUI_EDITOR,code

#  Messenger. Launched by SUPER+U, autostarted to the tray, pinned to tag 4.
env=MESSENGER,ferdium

#  Image viewer.
env=IMAGEVIEWER,imv

#  Document and PDF viewer.
env=DOCVIEWER,okular

#  Media player.
env=MEDIAPLAYER,vlc

#  Archive manager.
env=ARCHIVEMANAGER,ark
