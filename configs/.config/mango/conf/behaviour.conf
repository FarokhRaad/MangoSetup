# =============================================================================
#  Behaviour: focus, cursor, scratchpad, tiling interaction, XWayland
# =============================================================================


# -----------------------------------------------------------------------------
#  Focus
# -----------------------------------------------------------------------------
#  Focus follows the mouse pointer without clicking.
sloppyfocus=0

#  Let a window take focus when it asks for it (e.g. clicking a link opens
#  and raises the browser).
focus_on_activate=1

#  Let focusdir and focusstack cross monitor boundaries.
focus_cross_monitor=0

#  Allow focus movement to wrap into adjacent tags.
focus_cross_tag=0

#  Warp the pointer to the newly focused window.
warpcursor=1

# -----------------------------------------------------------------------------
#  Tag behaviour
# -----------------------------------------------------------------------------
#  Pressing the current tag's key again returns to the previous tag.
view_current_to_back=1

# -----------------------------------------------------------------------------
#  Cross-monitor operations
# -----------------------------------------------------------------------------
#  Allow exchange_client to swap windows across monitors.
exchange_cross_monitor=1

#  Allow the scratchpad to follow you between monitors.
scratchpad_cross_monitor=0

# -----------------------------------------------------------------------------
#  Floating windows
# -----------------------------------------------------------------------------
#  Snap floating windows to screen edges and to each other.
enable_floating_snap=1

#  Snap threshold in pixels.
snap_distance=50

# -----------------------------------------------------------------------------
#  Drag-to-tile
# -----------------------------------------------------------------------------
#  Drag a tiled window onto another to swap their positions.
drag_tile_to_tile=1

#  Shrink the dragged window while it is being moved.
drag_tile_small=1

#  Warp the cursor to the window when a drag starts.
drag_warp_cursor=0

#  Which corner is grabbed when resizing by drag: 0 = auto/nearest.
drag_corner=0

#  Redraw interval while dragging, in milliseconds.
drag_tile_refresh_interval=8
drag_floating_refresh_interval=8

# -----------------------------------------------------------------------------
#  Scratchpad
# -----------------------------------------------------------------------------
#  0 = independent scratchpad slots, 1 = one shared scratchpad.
single_scratchpad=0

# -----------------------------------------------------------------------------
#  Idle inhibition
# -----------------------------------------------------------------------------
#  Honour an app's idle inhibitor even when its window is hidden.
#  0 inhibits only while the window is visible.
idleinhibit_ignore_visible=0

# -----------------------------------------------------------------------------
#  Shortcut inhibition
# -----------------------------------------------------------------------------

#  Let applications grab all shortcuts, so keybindings reach VMs and remote
#  desktop clients.
allow_shortcuts_inhibit=1

# -----------------------------------------------------------------------------
#  Lock screen
# -----------------------------------------------------------------------------
#  Allow a transparent lock surface, needed for the DMS lock screen blur.
allow_lock_transparent=1

# -----------------------------------------------------------------------------
#  Input timing
# -----------------------------------------------------------------------------
#  Debounce for axisbind scroll actions, in milliseconds.
axis_bind_apply_timeout=100

# -----------------------------------------------------------------------------
#  XWayland
# -----------------------------------------------------------------------------
#  Keep XWayland clients alive while they are on an inactive tag.
xwayland_persistence=1

#  Explicit sync for XWayland. Crashes kitty on some GPUs.
syncobj_enable=0
