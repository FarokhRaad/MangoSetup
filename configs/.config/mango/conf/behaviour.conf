# =============================================================================
#  Behaviour: focus, cursor, scratchpad, tiling interaction, XWayland
# =============================================================================
#  RENAMED KEYS (old names are silently ignored, so they look like they work
#  while doing nothing):
#
#    adaptive_sync                    -> per-output vrr:0|1 in monitors.conf
#    inhibit_regardless_of_visibility -> idleinhibit_ignore_visible
# =============================================================================

# -----------------------------------------------------------------------------
#  Focus
# -----------------------------------------------------------------------------
#  Focus follows the mouse pointer without clicking.
#  Kept OFF because it fights with the scroller layout's edge focus and makes
#  pointer-over-bar interactions steal focus.
sloppyfocus=0

#  Let a window take focus when it asks for it (e.g. clicking a link opens
#  and raises the browser).
focus_on_activate=1

#  Allow focus movement (focusdir/focusstack) to cross monitor boundaries.
#  OFF keeps focus navigation predictable per screen; use focusmon to switch.
focus_cross_monitor=0

#  Allow focus movement to wrap into adjacent tags.
focus_cross_tag=0

#  Warp the pointer to the newly focused window. Prevents the cursor being
#  stranded on another monitor after a keyboard focus change.
warpcursor=1

# -----------------------------------------------------------------------------
#  Tag behaviour
# -----------------------------------------------------------------------------
#  Pressing the current tag's key again returns to the previously viewed tag.
#  Enabled so SUPER+<n> doubles as a toggle. This makes a dedicated
#  "previous tag" binding unnecessary.
view_current_to_back=1

# -----------------------------------------------------------------------------
#  Cross-monitor operations
# -----------------------------------------------------------------------------
#  Allow exchange_client to swap windows across monitors.
exchange_cross_monitor=1

#  Allow the scratchpad to follow you between monitors.
scratchpad_cross_monitor=0

# -----------------------------------------------------------------------------
#  Floating windows
# -----------------------------------------------------------------------------
#  Snap floating windows to screen edges and to each other.
enable_floating_snap=1

#  Snap threshold in pixels.
snap_distance=50

#  NOTE: `no_force_center` is a WINDOWRULE-ONLY option, not a global key.
#  Verified in mango 0.15.5 source: parse_config.h:2487 writes
#  `rule->no_force_center` inside the block opened by
#  strcmp(key, "windowrule") at parse_config.h:2382, i.e. it only exists as
#  a per-rule field on ConfigWinRule. Setting it here produced
#  "[ERROR]: Unknown keyword: no_force_center" from `mango -p`.
#
#  The per-client default is already 0 (mango.c:4672), which means floating
#  windows ARE centered on open by default. So there is nothing to set
#  globally; opt OUT per window instead:
#
#    windowrule=no_force_center:1,appid:^mpv$
#
#  Add such rules to rules-windows.conf, not here.

# -----------------------------------------------------------------------------
#  Drag-to-tile
# -----------------------------------------------------------------------------
#  Drag a tiled window onto another to swap their positions.
drag_tile_to_tile=1

#  Shrink the dragged window slightly to show it is being moved.
drag_tile_small=1

#  Warp the cursor to the window when a drag starts.
drag_warp_cursor=0

#  Which corner is grabbed when resizing by drag: 0 = auto/nearest.
drag_corner=0

#  Redraw interval in ms while dragging. Lower = smoother but more GPU load.
drag_tile_refresh_interval=8
drag_floating_refresh_interval=8

# -----------------------------------------------------------------------------
#  Scratchpad
# -----------------------------------------------------------------------------
#  0 = independent scratchpad slots, 1 = one shared scratchpad.
single_scratchpad=0

# -----------------------------------------------------------------------------
#  Idle inhibition
# -----------------------------------------------------------------------------
#  RENAMED from inhibit_regardless_of_visibility.
#  1 = honour an app's idle inhibitor even when its window is hidden
#      (keeps the screen awake for a minimized video call).
#  0 = only inhibit while the window is actually visible.
idleinhibit_ignore_visible=0

# -----------------------------------------------------------------------------
#  Window decorations
# -----------------------------------------------------------------------------
#  NOTE: `allow_csd` is a WINDOWRULE-ONLY option, not a global key.
#  Verified in mango 0.15.5 source: parse_config.h:2535 writes
#  `rule->allow_csd` inside the block opened by
#  strcmp(key, "windowrule") at parse_config.h:2382. Setting it here
#  produced "[ERROR]: Unknown keyword: allow_csd" from `mango -p`.
#
#  The per-client default is already 0 (mango.c:4690), and mango.c:5498
#  (`if (!c->allow_csd)`) forces server-side decorations in that case. So
#  the intent below ("0 forces SSD so every window matches appearance.conf")
#  is ALREADY the default behaviour globally; nothing needs setting.
#
#  To let one specific app draw its own client-side decorations instead:
#
#    windowrule=allow_csd:1,appid:^some-gtk-app$
#
#  Add such rules to rules-windows.conf, not here.

#  Let applications grab all shortcuts (needed for nested sessions, VMs and
#  remote desktop clients so their keybindings reach the guest).
allow_shortcuts_inhibit=1

# -----------------------------------------------------------------------------
#  Lock screen
# -----------------------------------------------------------------------------
#  Allow the lock surface to be transparent. Required for Noctalia's
#  lock screen to render its blurred background correctly.
allow_lock_transparent=1

# -----------------------------------------------------------------------------
#  Input timing
# -----------------------------------------------------------------------------
#  Debounce window for axisbind (scroll wheel) actions, in milliseconds.
#  Stops one flick of the wheel firing a tag switch several times.
axis_bind_apply_timeout=100

# -----------------------------------------------------------------------------
#  XWayland
# -----------------------------------------------------------------------------
#  Keep XWayland clients alive while they are on an inactive tag.
xwayland_persistence=1

#  Explicit sync (syncobj) for XWayland. Known to crash some apps
#  (notably kitty) on certain GPUs. Leave at 0 unless you have verified it
#  works; if you enable it and hit crashes, set env=WLR_DRM_NO_ATOMIC,1.
syncobj_enable=0
