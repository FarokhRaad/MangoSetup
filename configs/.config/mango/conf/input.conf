# =============================================================================
#  Input devices: keyboard, mouse, trackpad
# =============================================================================
#  Acceleration is set per device type: mouse_accel_* and trackpad_accel_*.
#  Most input settings need a re-login, not just reload_config.
# =============================================================================

# -----------------------------------------------------------------------------
#  Keyboard
# -----------------------------------------------------------------------------
#  Key repeat: rate in characters/second, delay in milliseconds before repeat.
repeat_rate=25
repeat_delay=600

#  Turn NumLock on at session start.
numlockon=1

#  XKB layouts. Comma-separated list; first entry is the default.
#  us = US QWERTY, ir = Persian
xkb_rules_layout=us,ir

#  Toggle layouts with Alt+Shift.
xkb_rules_options=grp:alt_shift_toggle

#  Additional XKB tuning (uncomment if needed):
# xkb_rules_variant=,pes
# xkb_rules_model=pc105
# xkb_rules_rules=evdev

# -----------------------------------------------------------------------------
#  Mouse
# -----------------------------------------------------------------------------
#  Acceleration profile: 0 = flat (raw, 1:1), 1 = adaptive, 2 = default
#  Use 0 for gaming or when you want no pointer acceleration at all.
mouse_accel_profile=2

#  Acceleration speed, -1.0 (slowest) to 1.0 (fastest). 0.0 = system default.
mouse_accel_speed=0.0

#  Reverse scroll direction ("natural"/touchscreen-style).
mouse_natural_scrolling=0

#  Multiplier applied to scroll wheel deltas.
axis_scroll_factor=1.0

# -----------------------------------------------------------------------------
#  Trackpad
# -----------------------------------------------------------------------------
#  Set to 1 to disable the trackpad completely.
disable_trackpad=0

trackpad_accel_profile=2
trackpad_accel_speed=0.0

#  Tap-to-click and drag behaviour.
tap_to_click=1
tap_and_drag=1
drag_lock=1

#  Ignore the trackpad briefly while typing to avoid stray cursor jumps.
disable_while_typing=1

trackpad_natural_scrolling=0
trackpad_scroll_factor=1.0

#  Swap left/right buttons for left-handed use.
left_handed=0

#  Emulate a middle click by pressing left+right together.
middle_button_emulation=0

#  Minimum movement before a swipe gesture is recognised.
swipe_min_threshold=1

#  Optional trackpad tuning (uncomment to use):
#  Scroll method: 0 = none, 1 = two-finger, 2 = edge, 3 = on-button-down
# scroll_method=1
#  Scroll button code when scroll_method=3 (274 = middle)
# scroll_button=274
#  Click method: 0 = none, 1 = button areas, 2 = clickfinger
# click_method=2
#  Send events mode: 0 = enabled, 1 = disabled,
#                    2 = disabled when an external mouse is attached
# send_events_mode=0
#  Button mapping for tap-to-click: 0 = L/R/M, 1 = R/L/M
# button_map=0

# -----------------------------------------------------------------------------
#  Cursor visibility
# -----------------------------------------------------------------------------
#  Auto-hide the cursor after N seconds of inactivity. 0 = never hide.
cursor_hide_timeout=0

#  Hide the cursor as soon as you start typing. Handy on laptops.
cursor_hide_on_keypress=0
