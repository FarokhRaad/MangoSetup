# =============================================================================
#  Layer-shell rules  (DankMaterialShell)
# =============================================================================
#  layerrule= matches on the LAYER NAMESPACE a client registers with the
#  wlr-layer-shell protocol, NOT on an appid. Namespaces are regex-matched
#  and, as with all mango rules, the FIRST matching rule wins.
#
#  SHELL MIGRATION (2026-08-03): Noctalia v5 -> DankMaterialShell.
#  Every namespace here changed. Noctalia used `noctalia-*` plus bare
#  `hot_corner_*`; DMS uses a colon-separated `dms:*` scheme.
#
#  Namespaces verified by grepping WlrLayershell.namespace assignments in
#  the DMS source tree (github.com/AvengeMedia/DankMaterialShell, quickshell/):
#    dms:bar                      the top bar
#    dms:dock                     dock (if enabled)
#    dms:spotlight                launcher/spotlight
#    dms:spotlight:clickcatcher   click-outside-to-dismiss shield
#    dms:toast                    toast notifications
#    dms:tooltip                  tooltips
#    dms:frame                    window frame overlay
#    dms:workspace-overview       overview
#    dms:blurwallpaper            blurred wallpaper layer
#    dms:fade-to-lock             lock transition
#    dms:fade-to-dpms             screen-off transition
#    dms:desktop-widget           desktop widgets (suffixed variants exist)
#    dms:desktop-widget-grid / -helper / -preview
#    dms:clipboard-co*            clipboard click-catcher
#    dms:dock-co* / dms:dock-exclusion*
#    dms:frame-exclusion* / dms:frame-lau*
#    dms:tray-me* / dms:tray-overflow-me*
#    dms:mo*  dms:d*  dms:lau*  (truncated in source scan; the catch-all
#                                `dms:.*` rule at the bottom covers these)
#
#  IMPORTANT: several namespaces are built by string concatenation in QML,
#  so a scan only sees the literal prefix. That is why the LAST rule here is
#  a deliberate `dms:.*` catch-all: any DMS surface not named explicitly
#  above still gets sane treatment instead of falling through to defaults.
#
#  Options available on layerrule (verified in parse_config.h, the layerrule
#  block at :2314): layer_name, animation_type_open, animation_type_close,
#  shield_when_capture, noblur, noanim, noshadow.
# =============================================================================

# --- Wallpaper -------------------------------------------------------------
#  Bottom-most layer. No blur (nothing behind it), no shadow, no animation.
layerrule=noblur:1,noshadow:1,noanim:1,layer_name:dms:blurwallpaper

# --- Bar -------------------------------------------------------------------
#  Blur ENABLED so the bar picks up the translucent look; no shadow/anim so
#  it does not visibly redraw on every workspace switch.
layerrule=noblur:0,noanim:1,noshadow:1,layer_name:dms:bar

# --- Dock ------------------------------------------------------------------
layerrule=noblur:0,noanim:1,layer_name:dms:dock
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:dms:dock-co.*
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:dms:dock-exclusion.*

# --- Launcher / spotlight --------------------------------------------------
layerrule=noblur:0,noanim:1,layer_name:dms:spotlight
#  Click-catcher shields are invisible; blurring them wastes GPU time.
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:dms:spotlight:clickcatcher
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:dms:lau.*

# --- Overview --------------------------------------------------------------
layerrule=noblur:0,noanim:1,layer_name:dms:workspace-overview

# --- Notifications / toasts / tooltips ------------------------------------
layerrule=noblur:0,noanim:1,layer_name:dms:toast
layerrule=noblur:0,noanim:1,layer_name:dms:tooltip

# --- Window frame / exclusion zones ---------------------------------------
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:dms:frame
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:dms:frame-exclusion.*
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:dms:frame-lau.*

# --- Desktop widgets -------------------------------------------------------
layerrule=noblur:1,noanim:1,layer_name:dms:desktop-widget.*

# --- Tray menus ------------------------------------------------------------
layerrule=noblur:0,noanim:1,layer_name:dms:tray-me.*
layerrule=noblur:0,noanim:1,layer_name:dms:tray-overflow-me.*

# --- Clipboard -------------------------------------------------------------
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:dms:clipboard-co.*

# --- Lock / DPMS transitions ----------------------------------------------
#  shield_when_capture:1 keeps these OUT of screenshots and screen shares,
#  so a lock transition never leaks into a recording.
layerrule=noblur:1,noanim:1,noshadow:1,shield_when_capture:1,layer_name:dms:fade-to-lock
layerrule=noblur:1,noanim:1,noshadow:1,shield_when_capture:1,layer_name:dms:fade-to-dpms

# --- Generic click-catchers ------------------------------------------------
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:.*clickcatcher.*

# --- Catch-all for any other DMS surface (MUST BE LAST of the dms rules) ---
#  Namespaces assembled at runtime in QML that the source scan could not
#  resolve to a literal land here. Conservative: no blur, no animation.
layerrule=noblur:1,noanim:1,layer_name:dms:.*
