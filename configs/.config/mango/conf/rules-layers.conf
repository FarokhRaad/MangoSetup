# =============================================================================
#  Layer-shell rules
# =============================================================================
#  layerrule=<option>:<value>,...,layer_name:<regex>
#
#  Matches the layer namespace a client registers with wlr-layer-shell, not an
#  appid. The first matching rule wins, so specific rules come before broad
#  ones and the dms:.* catch-all is last.
#
#  Options: layer_name, animation_type_open, animation_type_close,
#  shield_when_capture, noblur, noanim, noshadow.
# =============================================================================

# --- Wallpaper -------------------------------------------------------------
#  Bottom-most layer, so nothing to blur behind it.
layerrule=noblur:1,noshadow:1,noanim:1,layer_name:dms:blurwallpaper

# --- Bar -------------------------------------------------------------------
#  Blur on for the translucent look; no animation so it does not redraw on
#  every tag switch.
layerrule=noblur:0,noanim:1,noshadow:1,layer_name:dms:bar

# --- Dock ------------------------------------------------------------------
layerrule=noblur:0,noanim:1,layer_name:dms:dock
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:dms:dock-co.*
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:dms:dock-exclusion.*

# --- Launcher / spotlight --------------------------------------------------
layerrule=noblur:0,noanim:1,layer_name:dms:spotlight
#  Click-catcher shields are invisible, so blur would only cost GPU time.
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:dms:spotlight:clickcatcher
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:dms:lau.*

# --- Overview --------------------------------------------------------------
layerrule=noblur:0,noanim:1,layer_name:dms:workspace-overview

# --- Notifications / toasts / tooltips ------------------------------------
layerrule=noblur:0,noanim:1,layer_name:dms:toast
layerrule=noblur:0,noanim:1,layer_name:dms:tooltip

# --- Window frame / exclusion zones ---------------------------------------
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:dms:frame
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:dms:frame-exclusion.*
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:dms:frame-lau.*

# --- Desktop widgets -------------------------------------------------------
layerrule=noblur:1,noanim:1,layer_name:dms:desktop-widget.*

# --- Tray menus ------------------------------------------------------------
layerrule=noblur:0,noanim:1,layer_name:dms:tray-me.*
layerrule=noblur:0,noanim:1,layer_name:dms:tray-overflow-me.*

# --- Clipboard -------------------------------------------------------------
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:dms:clipboard-co.*

# --- Lock / DPMS transitions ----------------------------------------------
#  shield_when_capture keeps these out of screenshots and screen shares.
layerrule=noblur:1,noanim:1,noshadow:1,shield_when_capture:1,layer_name:dms:fade-to-lock
layerrule=noblur:1,noanim:1,noshadow:1,shield_when_capture:1,layer_name:dms:fade-to-dpms

# --- Generic click-catchers ------------------------------------------------
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:.*clickcatcher.*

# --- Catch-all for any other DMS surface, must stay last -------------------
#  DMS builds some namespaces at runtime, so they cannot be listed literally.
layerrule=noblur:1,noanim:1,layer_name:dms:.*
