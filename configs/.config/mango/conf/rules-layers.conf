# =============================================================================
#  Layer rules: blur / animation / shadow for layer-shell surfaces
# =============================================================================
#  Syntax:
#    layerrule=<option>:<value>,...,layer_name:<regex>
#
#  Options:
#    layer_name           regex matched against the layer-shell namespace
#    noblur               1 = never blur behind this layer
#    noanim               1 = never animate this layer
#    noshadow             1 = never draw a shadow for this layer
#    animation_type_open  zoom | slide | fade | none
#    animation_type_close zoom | slide | fade | none
#    shield_when_capture  1 = hide this layer from screen recordings
#
#  ###########################################################################
#  # These namespaces are for Noctalia v5 and are NOT interchangeable with   #
#  # v4.x. v4 was Quickshell/QML and named every surface                     #
#  # "noctalia-<thing>-<screen>". The v5 C++ rewrite uses a shorter, flatter #
#  # set, and most surfaces are NOT suffixed with the screen name.           #
#  # Rules written for v4 silently match nothing under v5.                   #
#  ###########################################################################
#
#  Verified against the v5 source by grepping `.nameSpace =` assignments
#  passed to zwlr_layer_shell_v1_get_layer_surface():
#
#    noctalia-bar-<name>              one per configured bar (e.g. -main)
#    noctalia-panel                   launcher, control-center, session,
#                                     clipboard, wallpaper, polkit
#                                     (all floating panels share this)
#    noctalia-attached-panel          panels anchored to a bar
#    noctalia-panel-click-shield      click-outside-to-close catcher
#    noctalia-click-shield            generic click catcher
#    noctalia-backdrop                dim/blur backdrop behind panels
#    noctalia-notification            notification toasts
#    noctalia-osd                     volume / brightness OSD
#    noctalia-dock                    dock
#    noctalia-wallpaper               wallpaper surface
#    noctalia-window-switcher         window switcher
#    noctalia-overview-launcher       overview-integrated launcher
#    noctalia-desktop-widget-<state>  desktop widgets
#    noctalia-desktop-widgets-editor  widget editor
#    noctalia-lockscreen-widgets-editor
#    noctalia-screenshot-region       region-select overlay
#    noctalia-idle-grace              pre-lock grace overlay
#    noctalia-screen-corner           rounded screen corners
#    noctalia-output-probe            invisible output probe
#    hot_corner_<corner>              hot corners (NOTE: no noctalia- prefix)
#
#  Ordering: the FIRST matching rule wins, so specific rules go above the
#  catch-all at the bottom.
# =============================================================================

# -----------------------------------------------------------------------------
#  Wallpaper
# -----------------------------------------------------------------------------
#  Nothing sits behind the wallpaper, so blurring it only costs GPU time.
layerrule=noblur:1,noshadow:1,noanim:1,layer_name:noctalia-wallpaper

# -----------------------------------------------------------------------------
#  Bar
# -----------------------------------------------------------------------------
#  Matches every bar; the namespace is "noctalia-bar-" plus the bar's
#  configured name, so the trailing .* is required.
#  Blur gives the frosted-glass look and needs blur_layer=1 in effects.conf.
#  noanim because Noctalia animates its own reveal, and doubling it looks bad.
layerrule=noblur:0,noanim:1,noshadow:1,layer_name:noctalia-bar-.*

# -----------------------------------------------------------------------------
#  Panels (launcher, control center, session, clipboard, wallpaper picker)
# -----------------------------------------------------------------------------
#  All floating panels share the single "noctalia-panel" namespace, so this
#  one rule covers the launcher, control center, session menu and the rest.
layerrule=noblur:0,noanim:1,layer_name:noctalia-panel
layerrule=noblur:0,noanim:1,layer_name:noctalia-attached-panel

#  Backdrop behind an open panel. Noctalia draws its own dim/blur here, so
#  adding mango's blur on top double-darkens it.
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:noctalia-backdrop

#  Invisible click-catchers: never decorate these.
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:noctalia-panel-click-shield
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:noctalia-click-shield

# -----------------------------------------------------------------------------
#  Notifications, OSD, switcher
# -----------------------------------------------------------------------------
layerrule=noblur:0,noanim:1,layer_name:noctalia-notification
layerrule=noblur:0,noanim:1,layer_name:noctalia-osd
layerrule=noblur:0,noanim:1,layer_name:noctalia-window-switcher
layerrule=noblur:0,noanim:1,layer_name:noctalia-overview-launcher

# -----------------------------------------------------------------------------
#  Dock and desktop widgets
# -----------------------------------------------------------------------------
layerrule=noblur:0,noanim:1,layer_name:noctalia-dock
layerrule=noblur:1,noanim:1,layer_name:noctalia-desktop-widget-.*
layerrule=noblur:1,noanim:1,layer_name:noctalia-desktop-widgets-editor
layerrule=noblur:1,noanim:1,layer_name:noctalia-lockscreen-widgets-editor

# -----------------------------------------------------------------------------
#  Screenshot region overlay
# -----------------------------------------------------------------------------
#  Blurring or animating the selection overlay would distort exactly what you
#  are trying to capture.
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:noctalia-screenshot-region

# -----------------------------------------------------------------------------
#  Idle / lock
# -----------------------------------------------------------------------------
#  Shown briefly before the lock screen engages.
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:noctalia-idle-grace

# -----------------------------------------------------------------------------
#  Invisible helper surfaces
# -----------------------------------------------------------------------------
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:noctalia-output-probe
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:noctalia-screen-corner
#  Hot corners are NOT prefixed with "noctalia-".
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:hot_corner_.*

# -----------------------------------------------------------------------------
#  Catch-all for any Noctalia surface added by a future version or a plugin
# -----------------------------------------------------------------------------
layerrule=noblur:0,noanim:1,layer_name:noctalia-.*

# -----------------------------------------------------------------------------
#  Third-party region selection tools
# -----------------------------------------------------------------------------
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:selection
layerrule=noblur:1,noanim:1,noshadow:1,layer_name:slurp
