# =============================================================================
#  Keybindings
# =============================================================================
#  Syntax:
#    bind=MODS,KEY,dispatcher[,arg...]
#    mousebind=MODS,btn_left|btn_right|btn_middle,dispatcher[,arg...]
#    axisbind=MODS,UP|DOWN,dispatcher[,arg...]
#    gesturebind=MODS,direction,fingers,dispatcher[,arg...]
#    switchbind=fold|unfold,dispatcher[,arg...]
#
#  MODS: SUPER, CTRL, ALT, SHIFT, or NONE. Combine with '+'.
#  KEY : use `wev` (Wayland) to find key names. Case-insensitive.
#
#  ###########################################################################
#  # BREAKING CHANGE (mango 0.15.5):                                        #
#  # If two bindings share the same modifier+key, ONLY THE FIRST IS APPLIED. #
#  # Duplicates are silently ignored, so a shortcut can appear to "not work" #
#  # with no error. This file is verified conflict-free by                   #
#  # scripts/validate-config.sh, which fails the build on any duplicate.     #
#  ###########################################################################
#
#  Shell IPC calls target Noctalia v5 (native C++ rewrite):
#    noctalia msg <command> [args]
#
#  IMPORTANT: this is NOT the v4.x syntax. Noctalia v4 was a Quickshell/QML
#  shell driven by `qs -c noctalia-shell ipc call <target> <function>`.
#  v5 dropped Quickshell entirely and replaced that with a flat, hyphenated
#  command namespace over its own IPC socket. The old form does not work.
#
#  Every command below was verified by grepping registerHandler() and
#  registerCycleHandler() in the v5 source tree (105 commands total), not
#  from documentation.
# =============================================================================

# =============================================================================
#  Modifier map (mnemonic scheme)
# =============================================================================
#    SUPER              act on the focused WINDOW, or launch an app
#    SUPER+SHIFT        stronger / inverse variant of the SUPER action
#    SUPER+CTRL         act on TAGS (send window to tag, move between tags)
#    SUPER+ALT          act on MONITORS, or nudge a floating window
#    ALT                view-level actions (overview, toggle tag)
#    CTRL+ALT           resize a floating window, system-level actions
# =============================================================================

# =============================================================================
#  Session and compositor control
# =============================================================================
#  Quit mango. Deliberately awkward to press so it cannot be hit by accident.
bind=SUPER+CTRL+SHIFT,Q,quit

#  Hot-reload the config. Applies everything except env= and most input
#  settings, which need a full re-login.
bind=SUPER+SHIFT,R,reload_config

#  Close the focused window gracefully (the Alt+F4 equivalent).
bind=SUPER,Q,killclient

#  Switch to a virtual TTY.
bind=CTRL+ALT,F1,chvt,1
bind=CTRL+ALT,F2,chvt,2
bind=CTRL+ALT,F3,chvt,3

# =============================================================================
#  Applications
# =============================================================================
#  These reference the ROLE variables set in apps.conf, not literal app
#  names. mango's spawn dispatcher runs each argument through wordexp(),
#  which performs real $VARIABLE expansion, so $TERMINAL below resolves to
#  whatever apps.conf currently sets it to. Swap an app there (or via
#  scripts/swap-app.sh) and these bindings pick it up on the next
#  reload_config (SUPER+SHIFT+R), no edits needed here.
bind=SUPER,Return,spawn,$TERMINAL 
bind=SUPER,E,spawn,$FILEMANAGER
bind=SUPER,C,spawn,$GUI_EDITOR
bind=SUPER,B,spawn,$BROWSER
bind=SUPER,F,spawn,$MESSENGER

#  spawn_on_empty starts the app only if the target tag has no windows yet,
#  which makes it safe to hammer the shortcut.
# bind=SUPER+SHIFT,B,spawn_on_empty,2,$BROWSER

# =============================================================================
#  Noctalia Shell (v5)
# =============================================================================
#  Panels are opened by id via `panel-toggle <id> [context]`.
#  Valid panel ids: launcher, clipboard, control-center, session, wallpaper,
#                   polkit, tray-drawer, setup-wizard
#
#  The launcher supports provider "contexts" using the configured
#  provider_prefix (default "/"), so `panel-toggle launcher /emo` opens it
#  straight into emoji mode. Providers and their prefixes are configured in
#  [shell.launcher.providers.*] in the Noctalia config.

#  Application launcher.
bind=SUPER,A,spawn,noctalia msg panel-toggle launcher
#  Clipboard history (v5 manages history itself; no cliphist needed).
bind=SUPER,V,spawn,noctalia msg panel-toggle clipboard
#  Launcher in calculator mode.
bind=SUPER,Slash,spawn,noctalia msg panel-toggle launcher /calc
#  Launcher in emoji mode.
bind=SUPER+SHIFT,E,spawn,noctalia msg panel-toggle launcher /emo
#  Window switcher.
bind=SUPER,W,spawn,noctalia msg window-switcher

#  Settings window.
bind=SUPER,comma,spawn,noctalia msg settings-toggle

#  Control center. Accepts a tab as context, e.g. `control-center audio`.
bind=CTRL+ALT,Delete,spawn,noctalia msg panel-toggle control-center

#  Notifications.
bind=SUPER,N,spawn,noctalia msg panel-toggle control-center notifications
bind=SUPER+SHIFT,D,spawn,noctalia msg notification-dnd-toggle
bind=SUPER+CTRL+SHIFT,N,spawn,noctalia msg notification-clear-history
#  Activate the newest notification's default action (raises the source app).
#  NOTE: SUPER+CTRL,N is reserved for switch_layout further down, so this uses
#  SUPER+CTRL,A instead. Keep this file conflict-free; validate-config.sh
#  fails on duplicates because since 0.15.5 only the first binding applies.
bind=SUPER+CTRL,A,spawn,noctalia msg notification-invoke-latest

#  Wallpaper: open the picker, or cycle.
bind=SUPER,Y,spawn,noctalia msg panel-toggle wallpaper
bind=SUPER+SHIFT,Y,spawn,noctalia msg wallpaper-random
bind=SUPER+CTRL,Y,spawn,noctalia msg wallpaper-next

#  Session menu (logout / reboot / shutdown / suspend).
bind=SUPER+SHIFT,Q,spawn,noctalia msg panel-toggle session
#  Lock immediately.
#  NOTE: the previous config had `bind=SUPER+ALT+L,spawn,...` which was
#  MISSING the comma between the modifiers and the key, so mango parsed "L"
#  as part of the modifier list and the binding silently never loaded.
#  Correct form is SUPER+ALT,L.
bind=SUPER+ALT,L,spawn,noctalia msg session lock
#  Lock then suspend.
bind=SUPER+ALT,S,spawn,noctalia msg session lock-and-suspend

#  Bar visibility.
bind=SUPER+SHIFT,B,spawn,noctalia msg bar-toggle

#  Theme and appearance.
bind=SUPER+SHIFT,T,spawn,noctalia msg theme-mode-toggle
#  Caffeine / idle inhibitor (v5 calls this "caffeine", not idleInhibitor).
bind=SUPER+SHIFT,I,spawn,noctalia msg caffeine-toggle
bind=SUPER+SHIFT,U,spawn,noctalia msg nightlight-toggle

#  Desktop widgets.
#  SUPER+SHIFT,W is reserved for the scroller set_proportion binding, so this
#  uses SUPER+SHIFT,O instead.
bind=SUPER+SHIFT,O,spawn,noctalia msg desktop-widgets-toggle

#  Reload the Noctalia config (it also hot-reloads on file change).
bind=SUPER+CTRL+SHIFT,R,spawn,noctalia msg config-reload

#  Turn all displays off (DPMS). Any input wakes them.
bind=SUPER+CTRL,O,spawn,noctalia msg dpms-off

# =============================================================================
#  Screenshots
# =============================================================================
#  Noctalia v5 ships a screenshot service, so grim/slurp pipelines are no
#  longer required. These write to the location configured in Noctalia and
#  raise a notification automatically.
#
#  Region select.
bind=NONE,Print,spawn,noctalia msg screenshot-region
#  Whole screen.
bind=SHIFT,Print,spawn,noctalia msg screenshot-fullscreen

#  Colour picker (external tool; Noctalia has no equivalent command).
bind=SUPER+SHIFT,C,spawn,hyprpicker -a -n

# =============================================================================
#  Keyboard layout
# =============================================================================
#  Cycle the layouts listed in input.conf (us -> ir). Alt+Shift also works
#  via xkb_rules_options.
bind=NONE,XF86HomePage,switch_keyboard_layout

# =============================================================================
#  Window focus
# =============================================================================
#  Cycle the stack. Note: mango's parser treats anything that is not
#  literally "next" as "prev", so the old config's typo "perv" happened to
#  work by accident. Spelled correctly here.
bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Tab,focusstack,prev

#  Jump back to the previously focused window.
bind=SUPER,Z,focuslast

#  Directional focus.
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# =============================================================================
#  Monitor focus
# =============================================================================
bind=SUPER+SHIFT,Left,focusmon,left
bind=SUPER+SHIFT,Right,focusmon,right

#  Turn the internal panel on/off (useful when docked).
bind=SUPER+CTRL,P,toggle_monitor,eDP-1

# =============================================================================
#  Move windows between monitors
# =============================================================================
bind=SUPER+ALT,Left,tagmon,left
bind=SUPER+ALT,Right,tagmon,right

# =============================================================================
#  Swap windows within a layout
# =============================================================================
bind=SUPER+CTRL+SHIFT,Up,exchange_client,up
bind=SUPER+CTRL+SHIFT,Down,exchange_client,down
bind=SUPER+CTRL+SHIFT,Left,exchange_client,left
bind=SUPER+CTRL+SHIFT,Right,exchange_client,right

# =============================================================================
#  Move and resize floating windows
# =============================================================================
#  smartmovewin / smartresizewin move a floating window, but adjust the
#  tiling split when the window is tiled, so one set of keys covers both.
bind=SUPER+ALT,Up,smartmovewin,+0,-20
bind=SUPER+ALT,Down,smartmovewin,+0,+20
bind=SUPER+ALT,K,smartmovewin,+0,-20
bind=SUPER+ALT,J,smartmovewin,+0,+20

bind=CTRL+ALT,Up,smartresizewin,+0,-20
bind=CTRL+ALT,Down,smartresizewin,+0,+20
bind=CTRL+ALT,Left,smartresizewin,-20,+0
bind=CTRL+ALT,Right,smartresizewin,+20,+0

#  Center a floating window.
bind=SUPER+SHIFT,Comma,centerwin

# =============================================================================
#  Window state
# =============================================================================
bind=SUPER,T,togglefloating
bind=SUPER,G,toggleglobal
bind=SUPER,O,toggleoverlay
bind=SUPER,S,toggle_scratchpad
bind=SUPER,M,minimized
bind=SUPER+SHIFT,M,restore_minimized

bind=SUPER+SHIFT,Return,togglemaximizescreen
bind=SUPER+SHIFT,F,togglefullscreen
#  Reports fullscreen to the app without actually resizing it. Handy for
#  games and video players that misbehave in real fullscreen.
bind=SUPER+CTRL,F,togglefakefullscreen

#  Float every window on the current tag at once.
bind=SUPER+CTRL,T,toggle_all_floating

#  Hide borders on the current tag.
bind=SUPER+CTRL,B,toggle_render_border

# =============================================================================
#  Overview
# =============================================================================
#  Exposé-style view of all windows on the tag.
bind=ALT,Tab,toggleoverview
#  Jump mode: overlays a letter on each window; press it to focus that one.
bind=ALT,Grave,togglejump

# =============================================================================
#  Window groups (0.15.0+)
# =============================================================================
#  Merge windows into a single tabbed group.
bind=SUPER+CTRL,G,groupjoin
bind=SUPER+CTRL+SHIFT,G,groupleave
bind=SUPER,Bracketleft,groupfocus,prev
bind=SUPER,Bracketright,groupfocus,next

# =============================================================================
#  Layouts
# =============================================================================
#  Cycle through circle_layout (see layouts.conf).
bind=SUPER+CTRL,N,switch_layout

#  Jump straight to a specific layout.
bind=SUPER+CTRL,S,setlayout,scroller
bind=SUPER+CTRL,I,setlayout,tile
bind=SUPER+CTRL,M,setlayout,monocle
bind=SUPER+CTRL,D,setlayout,dwindle

#  Master area size and count.
bind=SUPER,Minus,setmfact,-0.05
bind=SUPER,Equal,setmfact,+0.05
bind=SUPER+SHIFT,Minus,incnmaster,-1
bind=SUPER+SHIFT,Equal,incnmaster,1

#  Promote the focused window to master.
bind=SUPER+SHIFT,Space,zoom

# =============================================================================
#  Scroller layout
# =============================================================================
#  Cycle the widths in scroller_proportion_preset.
bind=SUPER,R,switch_proportion_preset
#  Make the focused column full width.
bind=SUPER+SHIFT,W,set_proportion,1.0
#  Stack windows within a scroller column.
bind=SUPER+CTRL+ALT,Up,scroller_stack,up
bind=SUPER+CTRL+ALT,Down,scroller_stack,down
bind=SUPER+CTRL+ALT,Left,scroller_stack,left
bind=SUPER+CTRL+ALT,Right,scroller_stack,right

# =============================================================================
#  Dwindle layout
# =============================================================================
bind=SUPER+ALT,Return,dwindle_toggle_split_direction
bind=SUPER+ALT,H,dwindle_split_horizontal
bind=SUPER+ALT,V,dwindle_split_vertical

# =============================================================================
#  Gaps
# =============================================================================
bind=SUPER+SHIFT,Bracketright,incgaps,2
bind=SUPER+SHIFT,Bracketleft,incgaps,-2
bind=SUPER+SHIFT,G,togglegaps

# =============================================================================
#  Tags: view
# =============================================================================
#  behaviour.conf sets view_current_to_back=1, so pressing the tag you are
#  already on returns you to the previous tag. That makes a separate
#  "previous tag" binding unnecessary.
#
#  NOTE: the old config bound SUPER+Tab TWICE, once to focusstack and once
#  to `view,-1`. Since 0.15.5 only the first binding is kept, so the tag
#  toggle silently did nothing. Resolved by relying on view_current_to_back.
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

#  Walk to the nearest tag that actually has windows.
bind=SUPER,Page_Up,viewtoleft_have_client,0
bind=SUPER,Page_Down,viewtoright_have_client,0

#  Walk to the adjacent tag whether or not it is empty.
bind=SUPER+SHIFT,Page_Up,viewtoleft,0
bind=SUPER+SHIFT,Page_Down,viewtoright,0

# =============================================================================
#  Tags: move the focused window
# =============================================================================
bind=SUPER+CTRL,1,tag,1,0
bind=SUPER+CTRL,2,tag,2,0
bind=SUPER+CTRL,3,tag,3,0
bind=SUPER+CTRL,4,tag,4,0
bind=SUPER+CTRL,5,tag,5,0
bind=SUPER+CTRL,6,tag,6,0
bind=SUPER+CTRL,7,tag,7,0
bind=SUPER+CTRL,8,tag,8,0
bind=SUPER+CTRL,9,tag,9,0

#  Send the window to an adjacent tag and follow it.
bind=SUPER+CTRL,Up,tagtoleft,0
bind=SUPER+CTRL,Down,tagtoright,0

#  Send the window to an adjacent tag WITHOUT following.
bind=SUPER+CTRL,Left,tagsilent,-1
bind=SUPER+CTRL,Right,tagsilent,+1

# =============================================================================
#  Tags: multi-tag view
# =============================================================================
#  Add or remove a tag from the current view (see several tags at once).
bind=ALT,1,toggleview,1
bind=ALT,2,toggleview,2
bind=ALT,3,toggleview,3
bind=ALT,4,toggleview,4
bind=ALT,5,toggleview,5
bind=ALT,6,toggleview,6
bind=ALT,7,toggleview,7
bind=ALT,8,toggleview,8
bind=ALT,9,toggleview,9

#  Make the focused window appear on an additional tag.
bind=SUPER+ALT,1,toggletag,1
bind=SUPER+ALT,2,toggletag,2
bind=SUPER+ALT,3,toggletag,3
bind=SUPER+ALT,4,toggletag,4
bind=SUPER+ALT,5,toggletag,5
bind=SUPER+ALT,6,toggletag,6
bind=SUPER+ALT,7,toggletag,7
bind=SUPER+ALT,8,toggletag,8
bind=SUPER+ALT,9,toggletag,9

#  Predefined tag combinations.
bind=CTRL+ALT,1,comboview,1
bind=CTRL+ALT,2,comboview,2
bind=CTRL+ALT,3,comboview,3
bind=CTRL+ALT,4,comboview,4
bind=CTRL+ALT,5,comboview,5
bind=CTRL+ALT,6,comboview,6
bind=CTRL+ALT,7,comboview,7
bind=CTRL+ALT,8,comboview,8
bind=CTRL+ALT,9,comboview,9

# =============================================================================
#  Media and hardware keys
# =============================================================================
#  Volume. Step size comes from the Noctalia config, so no argument is passed.
#  The *-osd variants also raise the on-screen display.
bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute

#  Microphone.
bind=NONE,XF86AudioMicMute,spawn,noctalia msg mic-mute

#  Media playback (MPRIS). The v5 'media' command is a single dispatcher
#  taking one action, rather than v4's separate per-action functions.
#  Valid: next previous toggle play pause stop next-player previous-player
bind=NONE,XF86AudioPlay,spawn,noctalia msg media toggle
bind=NONE,XF86AudioPause,spawn,noctalia msg media pause
bind=NONE,XF86AudioStop,spawn,noctalia msg media stop
bind=NONE,XF86AudioNext,spawn,noctalia msg media next
bind=NONE,XF86AudioPrev,spawn,noctalia msg media previous
#  Switch which player the media keys control.
bind=SUPER,P,spawn,noctalia msg media next-player

#  Display brightness. v5 exposes brightness-set with a relative argument;
#  brightness-osd shows the overlay. ddcutil drives external monitors,
#  the laptop panel goes through sysfs backlight.
bind=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-set +5
bind=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-set -5

#  Keyboard backlight.
bind=NONE,XF86KbdBrightnessUp,spawn,noctalia msg keyboard-backlight-up
bind=NONE,XF86KbdBrightnessDown,spawn,noctalia msg keyboard-backlight-down

#  Hardware toggles.
bind=NONE,XF86WLAN,spawn,noctalia msg wifi-toggle
bind=NONE,XF86Bluetooth,spawn,noctalia msg bluetooth-toggle
bind=NONE,XF86TouchpadToggle,toggle_trackpad_enable
bind=NONE,XF86Display,spawn,noctalia msg panel-toggle control-center

# =============================================================================
#  Mouse bindings
# =============================================================================
#  SUPER + drag to move, SUPER + right-drag to resize.
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
#  SUPER + middle click toggles floating.
mousebind=SUPER,btn_middle,togglefloating

# =============================================================================
#  Scroll wheel bindings
# =============================================================================
#  Debounced by axis_bind_apply_timeout in behaviour.conf.
axisbind=SUPER,UP,viewtoleft_have_client,0
axisbind=SUPER,DOWN,viewtoright_have_client,0
axisbind=SUPER+CTRL,UP,tagtoleft,0
axisbind=SUPER+CTRL,DOWN,tagtoright,0

# =============================================================================
#  Trackpad gestures
# =============================================================================
#  3 fingers: move focus. 4 fingers: change tag / toggle overview.
gesturebind=NONE,left,3,focusdir,left
gesturebind=NONE,right,3,focusdir,right
gesturebind=NONE,up,3,focusdir,up
gesturebind=NONE,down,3,focusdir,down
gesturebind=NONE,left,4,viewtoleft_have_client,0
gesturebind=NONE,right,4,viewtoright_have_client,0
gesturebind=NONE,up,4,toggleoverview,1
gesturebind=NONE,down,4,toggleoverview,1

# =============================================================================
#  Laptop lid switch
# =============================================================================
#  Turn the internal panel off when the lid closes and back on when it opens.
#  /etc/systemd/logind.conf is set to HandleLidSwitch=ignore (see
#  scripts/40-system-tweaks.sh) so systemd does not suspend the machine and
#  mango handles the lid itself.
switchbind=fold,disable_monitor,eDP-1
switchbind=unfold,enable_monitor,eDP-1
