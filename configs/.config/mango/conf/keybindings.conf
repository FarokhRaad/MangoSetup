# =============================================================================
#  Keybindings
# =============================================================================
#  Syntax:
#    bind[flags]=MODS,KEY,dispatcher[,args]
#    mousebind=MODS,BUTTON,dispatcher[,args]
#    axisbind=MODS,UP|DOWN|LEFT|RIGHT,dispatcher[,args]
#    gesturebind=MODS,direction,fingers,dispatcher[,args]
#    switchbind=fold|unfold,dispatcher[,args]
#
#  MODS: SUPER, CTRL, ALT, SHIFT, NONE. Combine with '+'.
#  KEY : a keysym name, case-insensitive. Find one with `wev`. Use code:N if a
#        keysym misbehaves on your layout (e.g. code:24 instead of q).
#
#  Flags on bind: l = also apply while locked, r = fire on release,
#  p = pass the key through to the client, s = match by keysym,
#  c = allow a conflicting duplicate (BOTH binds then run).
#
#  Duplicate keys: mango runs the FIRST bind it reads and only warns about the
#  rest, so a key must appear once across every sourced file.
#
#  The comment directly above a bind is its description in the DMS cheat sheet
#  (SUPER+SHIFT+/). Keep it to one line. Never put a comment on the bind line
#  itself: mango passes an inline # to spawn as an argument.
# =============================================================================

# =============================================================================
#  Modifier map
# =============================================================================
#    SUPER              act on the focused window, or launch an app
#    SUPER+SHIFT        stronger or inverse variant of the SUPER action
#    SUPER+CTRL         act on monitors and adjacent tags
#    SUPER+ALT          add a tag to a window, security actions
#    ALT                view-level actions (overview, toggle tag)
#    CTRL+ALT           system-level actions
# =============================================================================

# === MangoWM ===
# Reload the config
bind=SUPER+SHIFT,r,reload_config
# Exit MangoWM
bind=SUPER+CTRL+SHIFT,q,quit

# === Application Launchers ===
#  $ROLE variables come from conf/apps.conf, so scripts/swap-app.sh changes
#  what these launch without editing this file.
# Open Terminal
bind=SUPER,return,spawn,$TERMINAL
# Open Messenger
bind=SUPER,u,spawn,$MESSENGER
# Open File Manager
bind=SUPER,e,spawn,$FILEMANAGER
# Open Editor
bind=SUPER,c,spawn,$GUI_EDITOR
# Open Browser
bind=SUPER,b,spawn,$BROWSER

# === DMS IPC ===
# Application Launcher
bind=SUPER,a,spawn,dms ipc call spotlight toggle
# Spotlight Bar
bind=SUPER,space,spawn,dms ipc call spotlight-bar toggle
# Clipboard Manager
bind=SUPER,v,spawn,dms ipc call clipboard toggle
# Settings
bind=SUPER,comma,spawn,dms ipc call settings focusOrToggle
# Notification Center
bind=SUPER,n,spawn,dms ipc call notifications toggle
# Notepad
bind=SUPER+SHIFT,n,spawn,dms ipc call notepad toggle
# Browse Wallpapers
bind=SUPER,y,spawn,dms ipc call dash toggle wallpaper
# Power Menu
bind=SUPER,x,spawn,dms ipc call powermenu toggle
# Cycle Display Profile
bind=SUPER,p,spawn,dms ipc outputs cycleProfile
# Colour Picker
bind=SUPER+SHIFT,c,spawn,dms color pick -a

# === Cheat sheet ===
# Keyboard Shortcuts
bind=SUPER+SHIFT,slash,spawn,dms ipc call keybinds toggle mangowc

# === Security ===
# Lock Screen
bind=SUPER+ALT,l,spawn,dms ipc call lock lock
# Task Manager
bind=CTRL+ALT,Delete,spawn,dms ipc call processlist focusOrToggle

# === Window Rules ===
# Create Window Rule
bind=SUPER+SHIFT,w,spawn,dms ipc call window-rules toggle

# === Screenshots ===
# Screenshot: Interactive
bind=none,Print,spawn,dms screenshot
# Screenshot: Full Screen
bind=CTRL,Print,spawn,dms screenshot full
# Screenshot: Window
bind=ALT,Print,spawn,dms screenshot window

# === Audio Controls ===
# Volume Up
bind=none,XF86AudioRaiseVolume,spawn,dms ipc call audio increment 3
# Volume Down
bind=none,XF86AudioLowerVolume,spawn,dms ipc call audio decrement 3
# Mute Output
bind=none,XF86AudioMute,spawn,dms ipc call audio mute
# Mute Microphone
bind=none,XF86AudioMicMute,spawn,dms ipc call audio micmute
# Play / Pause
bind=none,XF86AudioPlay,spawn,dms ipc call mpris playPause
# Play / Pause
bind=none,XF86AudioPause,spawn,dms ipc call mpris playPause
# Stop Playback
bind=none,XF86AudioStop,spawn,dms ipc call mpris stop
# Previous Track
bind=none,XF86AudioPrev,spawn,dms ipc call mpris previous
# Next Track
bind=none,XF86AudioNext,spawn,dms ipc call mpris next

# === Brightness Controls ===
# Brightness Up
bind=none,XF86MonBrightnessUp,spawn,dms ipc call brightness increment 5
# Brightness Down
bind=none,XF86MonBrightnessDown,spawn,dms ipc call brightness decrement 5

# === Window Management ===
# Close Window
bind=SUPER,q,killclient
# Toggle maximize
bind=SUPER,f,togglemaximizescreen
# Toggle fullscreen
bind=SUPER+SHIFT,f,togglefullscreen
# Toggle fake fullscreen
bind=SUPER+CTRL,f,togglefakefullscreen
# Toggle floating
bind=SUPER+SHIFT,space,togglefloating
# Toggle floating for every window on this tag
bind=SUPER+CTRL,t,toggle_all_floating
# Center window
bind=SUPER+SHIFT,comma,centerwin
# Show window on all tags
bind=SUPER,g,toggleglobal
# Toggle scratchpad
bind=SUPER,s,toggle_scratchpad
# Minimize window
bind=SUPER,d,minimized
# Restore minimized
bind=SUPER+SHIFT,m,restore_minimized

# === Focus and Movement ===
# Focus window left
bind=SUPER,Left,focusdir,left
# Focus window right
bind=SUPER,Right,focusdir,right
# Focus window up
bind=SUPER,Up,focusdir,up
# Focus window down
bind=SUPER,Down,focusdir,down
# Focus next window
bind=SUPER,Tab,focusstack,next
# Focus previous window
bind=SUPER+SHIFT,Tab,focusstack,prev
# Focus last window
bind=SUPER,z,focuslast
# Jump to a window by letter
bind=ALT,Grave,togglejump
# Toggle overview
bind=ALT,Tab,toggleoverview

# Swap window left
bind=SUPER+SHIFT,Left,exchange_client,left
# Swap window right
bind=SUPER+SHIFT,Right,exchange_client,right
# Swap window up
bind=SUPER+SHIFT,Up,exchange_client,up
# Swap window down
bind=SUPER+SHIFT,Down,exchange_client,down

# === Groups ===
# Merge window into a group
bind=SUPER+CTRL,g,groupjoin
# Leave the group
bind=SUPER+CTRL+SHIFT,g,groupleave
# Focus previous group member
bind=SUPER,Bracketleft,groupfocus,prev
# Focus next group member
bind=SUPER,Bracketright,groupfocus,next

# === Monitors ===
# Focus monitor left
bind=SUPER+CTRL,Left,focusmon,left
# Focus monitor right
bind=SUPER+CTRL,Right,focusmon,right
# Move window to monitor left
bind=SUPER+CTRL+SHIFT,Left,tagmon,left
# Move window to monitor right
bind=SUPER+CTRL+SHIFT,Right,tagmon,right

# === Tags ===
# View tag 1
bind=SUPER,1,view,1
# View tag 2
bind=SUPER,2,view,2
# View tag 3
bind=SUPER,3,view,3
# View tag 4
bind=SUPER,4,view,4
# View tag 5
bind=SUPER,5,view,5
# View tag 6
bind=SUPER,6,view,6
# View tag 7
bind=SUPER,7,view,7
# View tag 8
bind=SUPER,8,view,8
# View tag 9
bind=SUPER,9,view,9

# Move to tag 1
bind=SUPER+SHIFT,1,tag,1
# Move to tag 2
bind=SUPER+SHIFT,2,tag,2
# Move to tag 3
bind=SUPER+SHIFT,3,tag,3
# Move to tag 4
bind=SUPER+SHIFT,4,tag,4
# Move to tag 5
bind=SUPER+SHIFT,5,tag,5
# Move to tag 6
bind=SUPER+SHIFT,6,tag,6
# Move to tag 7
bind=SUPER+SHIFT,7,tag,7
# Move to tag 8
bind=SUPER+SHIFT,8,tag,8
# Move to tag 9
bind=SUPER+SHIFT,9,tag,9

# Toggle view 1
bind=ALT,1,toggleview,1
# Toggle view 2
bind=ALT,2,toggleview,2
# Toggle view 3
bind=ALT,3,toggleview,3
# Toggle view 4
bind=ALT,4,toggleview,4
# Toggle view 5
bind=ALT,5,toggleview,5
# Toggle view 6
bind=ALT,6,toggleview,6
# Toggle view 7
bind=ALT,7,toggleview,7
# Toggle view 8
bind=ALT,8,toggleview,8
# Toggle view 9
bind=ALT,9,toggleview,9

# Also show window on tag 1
bind=SUPER+ALT,1,toggletag,1
# Also show window on tag 2
bind=SUPER+ALT,2,toggletag,2
# Also show window on tag 3
bind=SUPER+ALT,3,toggletag,3
# Also show window on tag 4
bind=SUPER+ALT,4,toggletag,4
# Also show window on tag 5
bind=SUPER+ALT,5,toggletag,5
# Also show window on tag 6
bind=SUPER+ALT,6,toggletag,6
# Also show window on tag 7
bind=SUPER+ALT,7,toggletag,7
# Also show window on tag 8
bind=SUPER+ALT,8,toggletag,8
# Also show window on tag 9
bind=SUPER+ALT,9,toggletag,9

# Send window one tag left
bind=SUPER+CTRL,Up,tagtoleft,0
# Send window one tag right
bind=SUPER+CTRL,Down,tagtoright,0
# View previous occupied tag
bind=SUPER,Page_Up,viewtoleft_have_client,0
# View next occupied tag
bind=SUPER,Page_Down,viewtoright_have_client,0
# View previous tag
bind=SUPER+SHIFT,Page_Up,viewtoleft,0
# View next tag
bind=SUPER+SHIFT,Page_Down,viewtoright,0

# === Layouts ===
# Cycle layout
bind=SUPER+CTRL,n,switch_layout
# Cycle window width preset
bind=SUPER,r,switch_proportion_preset
# Stack window into the scroller column above
bind=SUPER+CTRL+ALT,Up,scroller_stack,up
# Stack window into the scroller column below
bind=SUPER+CTRL+ALT,Down,scroller_stack,down
# Stack window into the scroller column left
bind=SUPER+CTRL+ALT,Left,scroller_stack,left
# Stack window into the scroller column right
bind=SUPER+CTRL+ALT,Right,scroller_stack,right
# Split horizontally (dwindle)
bind=SUPER+ALT,h,dwindle_split_horizontal
# Split vertically (dwindle)
bind=SUPER+ALT,v,dwindle_split_vertical
# Flip the split direction (dwindle)
bind=SUPER+ALT,return,dwindle_toggle_split_direction

# === Gaps and Borders ===
# Toggle gaps
bind=SUPER+SHIFT,g,togglegaps
# Increase gaps
bind=SUPER+SHIFT,Bracketright,incgaps,+1
# Decrease gaps
bind=SUPER+SHIFT,Bracketleft,incgaps,-1
# Toggle borders
bind=SUPER+SHIFT,b,toggle_render_border

# === Input ===
#  Alt+Shift already switches layout via xkb_rules_options=grp:alt_shift_toggle
#  in conf/input.conf, so no bind is needed for that. This is an explicit
#  alternative on a dedicated key.
# Switch keyboard layout
bind=none,XF86HomePage,switch_keyboard_layout
# Toggle the trackpad
bind=none,XF86TouchpadToggle,toggle_trackpad_enable

# =============================================================================
#  Mouse bindings
# =============================================================================
#  With MODS=NONE only btn_middle works while tiling; btn_left and btn_right
#  are reserved for overview mode.
# Move a floating window
mousebind=SUPER,btn_left,moveresize,curmove
# Resize a floating window
mousebind=SUPER,btn_right,moveresize,curresize
# Toggle floating
mousebind=SUPER,btn_middle,togglefloating

# =============================================================================
#  Scroll wheel bindings
# =============================================================================
#  Debounced by axis_bind_apply_timeout in conf/behaviour.conf.
# View previous occupied tag
axisbind=SUPER,UP,viewtoleft_have_client,0
# View next occupied tag
axisbind=SUPER,DOWN,viewtoright_have_client,0
# Send window one tag left
axisbind=SUPER+CTRL,UP,tagtoleft,0
# Send window one tag right
axisbind=SUPER+CTRL,DOWN,tagtoright,0

# =============================================================================
#  Touchpad gestures
# =============================================================================
# Switch to the previous occupied tag
gesturebind=none,right,3,viewtoleft_have_client
# Switch to the next occupied tag
gesturebind=none,left,3,viewtoright_have_client
# Toggle overview
gesturebind=none,up,4,toggleoverview
# Toggle overview
gesturebind=none,down,4,toggleoverview

# =============================================================================
#  Laptop lid switch
# =============================================================================
#  Requires HandleLidSwitch=ignore in logind

# Turn the internal panel off
switchbind=fold,disable_monitor,eDP-1
# Turn the internal panel on
switchbind=unfold,enable_monitor,eDP-1

# =============================================================================
#  Disabled: floating window nudge and resize
# =============================================================================
#  smartmovewin and smartresizewin move a floating window and adjust the split
#  when it is tiled. Left commented because SUPER+ALT+arrows and CTRL+ALT+arrows
#  are currently free for you to assign.
# bind=SUPER+ALT,Up,smartmovewin,+0,-20
# bind=SUPER+ALT,Down,smartmovewin,+0,+20
# bind=CTRL+ALT,Up,smartresizewin,+0,-20
# bind=CTRL+ALT,Down,smartresizewin,+0,+20
# bind=CTRL+ALT,Left,smartresizewin,-20,+0
# bind=CTRL+ALT,Right,smartresizewin,+20,+0
