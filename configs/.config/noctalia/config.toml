# =============================================================================
#  Noctalia v5 starter config
# =============================================================================
#  Deploy to: ~/.config/noctalia/config.toml (handled by 20-symlink.sh)
#
#  This is a MINIMAL override file, not a full copy of Noctalia's defaults.
#  Noctalia deep-merges whatever is here on top of its built-in defaults
#  (see ConfigService::deepMerge in the v5 source), so anything NOT listed
#  below just uses the shipped default. The full default reference lives in
#  the Noctalia repo's example.toml; consult it before adding a section here.
#
#  Hot reload: most settings apply on save (Noctalia watches the file).
#  A few are startup-only; those are noted inline.
#
#  IPC: `noctalia msg config-reload` forces a reload if you don't trust the
#  watcher, or after editing this while testing scripts/swap-app.sh changes.
# =============================================================================

# ── Shell ─────────────────────────────────────────────────────────────────────

[shell]
#  mango is detected automatically via MANGO_INSTANCE_SIGNATURE / the
#  XDG_CURRENT_DESKTOP hint set in configs/.config/mango/conf/environment.conf.
#  Nothing to configure here for that.
polkit_agent = true   # Noctalia's built-in polkit agent (see packages/packages.txt:
                       # polkit-kde-agent is intentionally NOT installed)
clipboard_enabled = true
clipboard_history_max_entries = 200

[shell.panel]
transparency_mode = "glass"   # solid | soft | glass; matches the mango blur setup
                               # in configs/.config/mango/conf/effects.conf

[shell.launcher]
provider_prefix = "/"

# ── Wallpaper ─────────────────────────────────────────────────────────────────

[wallpaper]
enabled   = true
fill_mode = "crop"
directory = "~/Pictures/Wallpapers"
#  Create this directory and drop wallpapers in before first login, or
#  Noctalia will start with no wallpaper set:
#    mkdir -p ~/Pictures/Wallpapers

[wallpaper.automation]
enabled          = false   # set true for automatic rotation
interval_seconds = 1800
order            = "random"

# ── Theme ─────────────────────────────────────────────────────────────────────

[theme]
mode    = "dark"
source  = "builtin"
builtin = "Noctalia"
#  Switch to "wallpaper" to auto-generate a palette from the current
#  wallpaper via matugen (already in packages/packages.txt).
# source = "wallpaper"
# wallpaper_scheme = "m3-content"

[theme.templates]
#  Opting into Noctalia's builtin theme templates. Verified against
#  assets/templates/builtin.toml in the v5 source; each id below writes
#  files this setup already expects:
#    mango  -> ~/.config/mango/noctalia.conf + appends a source= line to
#              config.conf; REPLACES the hand-picked colors in
#              configs/.config/mango/conf/appearance.conf with a live
#              wallpaper/palette-derived scheme. See that file's header.
#    qt     -> ~/.config/qt5ct/colors/noctalia.conf and .../qt6ct/...,
#              which qt5ct.conf/qt6ct.conf's color_scheme_path now points at.
#    gtk3, gtk4 -> ~/.config/gtk-{3,4}.0/noctalia.css, @imported by gtk.css.
#    kcolorscheme -> ~/.local/share/color-schemes/noctalia.colors, usable
#              as a KDE color scheme for the Qt apps this setup keeps
#              (Dolphin/Okular/Gwenview/Ark/Konsole) via System Settings ->
#              Colors, or `plasma-apply-colorscheme noctalia`.
#  Comment out any id to keep that app's own manually-set theme instead.
enable_builtin_templates   = true
builtin_ids                = ["mango", "qt", "gtk3", "gtk4", "kcolorscheme"]
enable_community_templates = true
community_ids              = []

# ── Notifications ─────────────────────────────────────────────────────────────

[notification]
enable_daemon = true
layer         = "top"

# ── OSD ───────────────────────────────────────────────────────────────────────

[osd]
position = "top_right"

[osd.kinds]
volume     = true
brightness = true
wifi       = true
bluetooth  = true
dnd        = true

# ── Lock Screen ───────────────────────────────────────────────────────────────

[lockscreen]
enabled         = true
blurred_desktop = true    # requires wlr-screencopy support; mango has it
blur_intensity  = 0.5

# ── Brightness ────────────────────────────────────────────────────────────────

[brightness]
#  ddcutil IS installed (2.2.7), but DDC/CI does NOT work on this machine's
#  external monitors. Verified 2026-08-03, not assumed:
#    DP-2      (BenQ GW2381, TCK0321501Q) -> "DDC communication failed" on
#                every attempt, including --sleep-multiplier 5 and
#                --disable-dynamic-sleep.
#    HDMI-A-1  (BenQ GW2381, TCK0368401Q) -> INTERMITTENT. `ddcutil detect`
#                finds it in ~4 of 5 passes and a getvcp read sometimes
#                returns brightness=100, but every setvcp WRITE failed with
#                DDCRC_RETRIES / DDCRC_READ_ALL_ZERO across 3 attempts.
#    eDP-1     -> laptop panel; ddcutil reports "Laptop displays do not
#                support DDC/CI" and uses the sysfs backlight backend
#                instead. That path works and is unaffected by this setting.
#
#  Left FALSE because a read-only, intermittently-detected monitor produces
#  a brightness slider that appears functional but silently does nothing.
#
#  To retry: both BenQ GW2381 panels have DDC/CI as an OSD menu option that
#  ships DISABLED on many units. Enable it in each monitor's own menu, then:
#    ddcutil detect && ddcutil -d 1 setvcp 10 80
#  If the write succeeds, flip this back to true.
enable_ddcutil = false

# ── Audio ─────────────────────────────────────────────────────────────────────

[audio]
enable_sounds = false

# ── System Monitor ────────────────────────────────────────────────────────────

[system.monitor]
enabled = true

# ── Bar ───────────────────────────────────────────────────────────────────────

[bar.main]
position   = "top"
thickness  = 34
auto_hide  = false
reserve_space = true

#  Widget layout. Session/control-center/lock are reachable here AND via the
#  mango keybindings in configs/.config/mango/conf/keybindings.conf; having
#  both is deliberate; use whichever is faster in the moment.
start  = ["launcher", "workspaces"]
center = ["clock"]
end    = ["media", "tray", "notifications", "network", "bluetooth", "volume", "brightness", "battery", "control-center", "session"]

#  Per-monitor overrides: this setup has three outputs
#  (eDP-1 laptop panel, DP-2 rotated portrait, HDMI-A-1 primary desktop
#  monitor; see configs/.config/mango/conf/monitors.conf for exact geometry).
#  Uncomment and adjust if you want the bar to differ per monitor, e.g. a
#  thinner bar on the rotated portrait display:
# [bar.main.monitor.dp2]
# match     = "DP-2"
# thickness = 28

# ── Dock ──────────────────────────────────────────────────────────────────────

[dock]
enabled  = false   # mango already provides tags/workspaces; enable if you
                    # still want a dock for pinned launchers
position = "bottom"
pinned   = []       # e.g. ["konsole", "dolphin", "microsoft-edge-stable"]
#  NOTE: unlike mango's keybindings.conf, this list is NOT tied to
#  apps.conf's role variables; Noctalia's TOML has no $VAR expansion. If you
#  swap an app with scripts/swap-app.sh, update this list by hand too.

# ── Idle ──────────────────────────────────────────────────────────────────────
#  Noctalia handles idle/lock itself; do NOT also run swayidle (see the note
#  in configs/.config/mango/conf/autostart.conf).

[idle.behavior.lock]
timeout = 600
action  = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 660
action  = "screen_off"
enabled = true
